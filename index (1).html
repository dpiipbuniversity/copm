let F = null; // state form aktif

function halamanForm(jenisRute, tipe, catat, edit) {
  const jenis = jenisRute === 'surat' ? 'Surat' : 'Desain';
  const sah = jenis === 'Surat' ? ['buat_dari_nol', 'draft_saya', 'siap_disign', 'ttd_basah'] : ['desain_baru', 'lanjutkan_draft'];
  if (sah.indexOf(tipe) === -1) { location.hash = catat ? '#catat' : '#ajukan'; return; }
  const kunciDraf = 'copm_draf_' + (catat ? 'catat_' : '') + jenis;
  // Pertahankan isian bila hanya berpindah tipe di jenis yang sama
  const lanjut = F && F.jenis === jenis && F.catat === catat && (edit ? F.edit === edit.tiket : !F.edit);
  F = lanjut ? F : { jenis, catat, nilai: edit ? edit.nilai : {}, utama: [], lampiran: [], referensi: [], draft: [], tujuanMassal: {}, kunciDraf: edit ? null : kunciDraf, galat: {}, sudahKirim: false, edit: edit ? edit.tiket : null };
  F.tipe = tipe;
  if (!lanjut && !edit) {
    const draf = simpan.get(kunciDraf);
    if (draf && Object.keys(draf).some(k => draf[k] && k !== 'prioritas')) { F.nilai = draf; F.dipulihkan = true; }
  }
  const n = F.nilai;
  n.tipe = tipe;
  if (!n.prioritas) n.prioritas = 'Terjadwal';
  if (!n.bulan_keperluan) n.bulan_keperluan = isoBulan(new Date());
  if (catat && !n.sumber) n.sumber = 'WA';
  gambarForm();
}

function gambarForm() {
  const n = F.nilai, surat = F.jenis === 'Surat';
  const judul = F.edit ? 'Sunting pengajuan ' + F.edit : (F.catat ? 'Catat pengajuan ' : 'Ajukan ') + (surat ? 'surat' : 'desain');
  $('#konten').innerHTML =
    '<div class="judul-halaman"><div class="teks"><a class="ket" href="' + (F.edit ? '#tiket/' + F.edit : F.catat ? '#catat' : '#ajukan') + '">' + (F.edit ? '← Kembali ke detail' : '← Pilih jenis lain') + '</a><h1>' + judul + '</h1>' +
      '<p class="redup">' + (F.edit ? 'Perubahan tercatat di riwayat pengajuan, satu baris per isian yang berubah. Berkas lama tetap tersimpan; berkas baru boleh ditambahkan.' : F.catat ? 'Untuk pengajuan yang masuk lewat WA, email, atau lisan. Log mencatat Anda sebagai pencatat dan nama pemohon aslinya.' : 'Isian bertanda <span class="opsional">opsional</span> boleh dikosongkan.') + '</p></div></div>' +
    (F.dipulihkan ? '<div class="info">' + ik('segar') + '<span>Isian terakhir Anda di perangkat ini dipulihkan. Berkas perlu dipilih ulang. <button type="button" onclick="kosongkanForm()">Kosongkan form</button></span></div>' : '') +
    '<form class="form-tata" id="formPengajuan" novalidate autocomplete="off">' +
      '<div class="form-kiri">' + '<div id="galatRingkas"></div>' + (surat ? bagianSurat() : bagianDesain()) + '</div>' +
      '<aside class="form-kanan" id="panelKanan"></aside>' +
    '</form>';
  pasangPerilakuForm();
  gambarPanelKanan();
  tandaiGalat();
}

/* ---------------------------------------------------------------- pembangun isian */
const val = k => F.nilai[k] === undefined || F.nilai[k] === null ? '' : F.nilai[k];
function isian(kolom, label, kontrol, opt) {
  opt = opt || {};
  return '<div class="isian' + (opt.kelas ? ' ' + opt.kelas : '') + '" data-kolom="' + kolom + '">' +
    (label ? '<label' + (opt.untuk === false ? '' : ' for="f-' + kolom + '"') + '>' + label + (opt.opsional ? '<span class="opsional">opsional</span>' : '') + '</label>' : '') +
    kontrol +
    (opt.bantuan ? '<span class="bantuan">' + opt.bantuan + '</span>' : '') +
    '<span class="pesan-salah"></span>' + (opt.ekstra || '') + '</div>';
}
const masukan = (k, type, attr) => '<input class="kontrol" id="f-' + k + '" name="' + k + '" type="' + (type || 'text') + '" value="' + esc(val(k)) + '"' + (attr || '') + '>';
const areaTeks = (k, ph, baris) => '<textarea class="kontrol" id="f-' + k + '" name="' + k + '" rows="' + (baris || 4) + '" placeholder="' + esc(ph || '') + '">' + esc(val(k)) + '</textarea>';
function pilihan(k, opsi, ph) {
  return '<select class="kontrol" id="f-' + k + '" name="' + k + '" data-ubah="1"><option value="">' + esc(ph || 'Pilih…') + '</option>' +
    opsi.map(o => { const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; return '<option value="' + esc(v) + '"' + (val(k) === v ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';
}
const centang = (k, label, ubah) => '<label class="centang"><input type="checkbox" name="' + k + '"' + (val(k) ? ' checked' : '') + (ubah ? ' data-ubah="1"' : '') + '><span>' + label + '</span></label>';
function segmen(k, opsi, ringkas) {
  return '<div class="segmen' + (ringkas ? ' ringkas' : '') + '" role="radiogroup">' + opsi.map(o =>
    '<label><input type="radio" name="' + k + '" value="' + esc(o.v) + '"' + (val(k) === o.v ? ' checked' : '') + ' data-ubah="1"><span class="jdl">' + esc(o.l) + '</span>' + (o.ket ? '<span class="ket">' + esc(o.ket) + '</span>' : '') + '</label>').join('') + '</div>';
}
function chipPilih(k, opsi, ganda, ubah) {
  const terpilih = ganda ? (Array.isArray(val(k)) ? val(k) : []) : [val(k)];
  return '<div class="chip-grup">' + opsi.map(o => {
    const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l;
    return '<label class="cp"><input type="' + (ganda ? 'checkbox' : 'radio') + '" name="' + k + '" value="' + esc(v) + '"' + (terpilih.indexOf(v) > -1 ? ' checked' : '') + (ubah ? ' data-ubah="1"' : '') + '>' + esc(l) + (o.uk ? '<span class="uk">' + esc(o.uk) + '</span>' : '') + '</label>';
  }).join('') + '</div>';
}
function bagian(no, judul, ket, isi, id) {
  return '<section class="kartu bagian"' + (id ? ' id="' + id + '"' : '') + '><div class="bagian-kepala"><span class="no">' + no + '</span><div><h2>' + judul + '</h2>' + (ket ? '<p>' + ket + '</p>' : '') + '</div></div><div class="bagian-isi">' + isi + '</div></section>';
}
function zonaUnggah(daftar, label, format, ganda) {
  const f = FORMAT_BERKAS[format];
  const batas = Number((S.ref.pengaturan || {}).batas_unggah_mb) || 20;
  const isi = F[daftar].map((b, i) =>
    '<div class="item-berkas"><span class="ikon-berkas">' + esc(ekstensi(b.name).toUpperCase().slice(0, 4) || 'FILE') + '</span>' +
    '<div style="min-width:0"><div class="nm">' + esc(b.name) + '</div><div class="ket">' + ukuranTeks(b.size) + '</div></div>' +
    '<button type="button" class="tbl hantu kecil ikon-saja" aria-label="Hapus ' + esc(b.name) + '" onclick="hapusBerkas(\'' + daftar + '\',' + i + ')">' + ik('x') + '</button></div>').join('');
  const tampilZona = ganda || !F[daftar].length;
  return (isi ? '<div class="daftar-berkas">' + isi + '</div>' : '') +
    (tampilZona ? '<label class="zona" data-zona="' + daftar + '">' + ik('unduh') +
      '<span class="jdl">' + label + '</span><span class="ket">Seret ke sini atau klik untuk memilih · ' + f.ket + ' · maks. ' + batas + ' MB per berkas</span>' +
      '<input type="file"' + (f.accept ? ' accept="' + f.accept + '"' : '') + (ganda ? ' multiple' : '') + ' data-daftar="' + daftar + '"></label>' : '');
}
const ekstensi = nama => (String(nama).match(/\.([A-Za-z0-9]{1,6})$/) || ['', ''])[1];
const ukuranTeks = b => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1).replace('.', ',') + ' MB';

/* ---------------------------------------------------------------- bagian: catat */
function bagianCatat(no) {
  if (!F.catat) return '';
  const semua = S.ref.pengguna.slice().sort((a, b) => (b.aktif - a.aktif) || a.nama.localeCompare(b.nama));
  return bagian(no, 'Dicatat atas nama', 'Pemohon asli pengajuan ini dan dari mana permintaannya datang.',
    '<div class="baris-2">' +
      isian('atas_nama', 'Atas nama', pilihan('atas_nama', semua.map(u => ({ v: u.nama, l: u.nama + ' · ' + u.ekosistem + (u.jabatan ? ' · ' + u.jabatan : '') + (u.aktif ? '' : ' (tidak memakai COPM)') })), 'Pilih pemohon…')) +
      isian('sumber', 'Sumber', chipPilih('sumber', SUMBER_CATAT, false), { untuk: false }) +
    '</div>');
}

/* ---------------------------------------------------------------- bagian: prioritas */
function bagianPrioritas(no) {
  const n = F.nilai;
  let lanjut = '';
  if (n.prioritas === 'Biasa') lanjut = isian('bulan_keperluan', 'Bulan keperluan', masukan('bulan_keperluan', 'month'));
  else {
    lanjut = '<div class="baris-2">' + isian('batas_keperluan', 'Batas keperluan', masukan('batas_keperluan', 'date', ' min="' + isoTanggal(hariIni()) + '"'),
      { bantuan: 'Kapan berkas harus sudah selesai' + (F.jenis === 'Surat' ? ' ber-TTD' : '') + '.', ekstra: '<div id="peringatanMepet"></div>' }) + '</div>';
    if (n.prioritas === 'Mendesak') lanjut += isian('alasan_mendesak', 'Alasan mendesak', masukan('alasan_mendesak', 'text', ' placeholder="Contoh: diminta kantor imigrasi besok pagi"'));
  }
  return bagian(no, 'Prioritas & waktu', 'Admin dapat menyesuaikan prioritas bila perlu; perubahannya tercatat beserta alasannya.',
    isian('prioritas', '', segmen('prioritas', ['Biasa', 'Terjadwal', 'Mendesak'].map(p => ({ v: p, l: p, ket: PRIORITAS_INFO[p] }))), { untuk: false }) +
    lanjut +
    (F.jenis === 'Surat' ? '<div class="baris-2">' + isian('tanggal_surat', 'Tanggal surat', masukan('tanggal_surat', 'date'), { opsional: true, bantuan: 'Tanggal yang tercetak di surat. Boleh tanggal mundur.' }) + '</div>' : ''));
}

/* ---------------------------------------------------------------- SURAT */
function bagianSurat() {
  const n = F.nilai, t = F.tipe;
  let no = 0;
  const kat = S.ref.kategori.find(k => k.kategori === n.kategori);
  const kegiatanWajib = kat && kat.blok_kegiatan === 'wajib';
  const ttd = S.ref.penandatangan.find(p => p.jabatan === n.penandatangan);
  const perluBerkas = t !== 'buat_dari_nol';
  const bisaMassal = t === 'draft_saya' || t === 'siap_disign';
  const massal = bisaMassal && !!n.massal;

  let html = F.catat ? bagianCatat(++no) : '';

  html += bagian(++no, 'Tipe pengajuan', 'Pilih yang paling sesuai dengan kondisi surat saat ini.',
    isian('tipe', '', segmen('tipe', ['buat_dari_nol', 'draft_saya', 'siap_disign', 'ttd_basah'].map(v => ({ v, l: TIPE_LABEL[v], ket: TIPE_INFO[v].ket }))), { untuk: false }) +
    (t === 'draft_saya' ? isian('aksi_draft', 'Aksi yang dibutuhkan dari admin', chipPilih('aksi_draft', AKSI_DRAFT, true), { untuk: false, bantuan: 'Pilih semua yang perlu dikerjakan admin pada draf Anda.' }) : ''));

  html += bagian(++no, 'Isi surat', '',
    isian('perihal', 'Perihal', masukan('perihal', 'text', ' placeholder="Contoh: Permohonan Perpanjangan ITAS Mahasiswa Internasional" maxlength="200"')) +
    '<div class="baris-2">' +
      isian('kategori', 'Kategori surat', pilihan('kategori', S.ref.kategori.map(k => k.kategori), 'Pilih kategori…')) +
      isian('penandatangan', 'Penandatangan', pilihan('penandatangan', S.ref.penandatangan.map(p => p.jabatan), 'Pilih penandatangan…'), { bantuan: ttd ? 'Rantai paraf: ' + esc(ttd.rantai_paraf) : '' }) +
    '</div>' +
    isian('tujuan', 'Tujuan surat', masukan('tujuan', 'text', ' list="saranTujuan" placeholder="Contoh: Kepala Kantor Imigrasi Kelas I Bogor"') +
      '<datalist id="saranTujuan">' + (S.ref.saranTujuan || []).map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>',
      { bantuan: massal ? 'Untuk pengajuan massal, isi tujuan umum di sini (misalnya "21 mitra internasional"); tujuan per surat diisi di tabel berkas.' : '' }) +
    isian('ringkasan', 'Ringkasan / substansi', areaTeks('ringkasan', 'Apa isi pokok surat ini? Sebutkan nama, tanggal, atau data penting yang harus ada.', 4)));

  // Berkas
  let berkas = '';
  if (perluBerkas) {
    const fmtUtama = t === 'siap_disign' ? 'pdf' : 'surat';
    const labelUtama = { draft_saya: 'Unggah draf surat', siap_disign: 'Unggah PDF siap tanda tangan', ttd_basah: 'Unggah hasil pindai surat' }[t];
    if (bisaMassal && F.edit) berkas += massal ? '<div class="info">' + ik('tumpuk') + '<span>Pengajuan massal. Berkas per surat dikelola di halaman detail.</span></div>' : '';
    else if (bisaMassal) berkas += centang('massal', '<b>Pengajuan massal</b>: banyak surat sejenis dalam satu tiket (misalnya 21 undangan dengan tujuan berbeda)', true);
    if (!(F.edit && massal)) berkas += isian('utama', F.edit ? 'Tambah versi baru berkas surat' : massal ? 'Berkas surat (semua sekaligus)' : 'Berkas surat', zonaUnggah('utama', massal ? 'Pilih semua berkas surat' : labelUtama, fmtUtama, massal), { untuk: false });
    if (massal && F.utama.length && !F.edit) {
      berkas += isian('tujuan_massal', 'Tujuan per surat', '<div class="gulir"><table class="tabel-massal"><thead><tr><th>#</th><th>Berkas</th><th>Tujuan</th></tr></thead><tbody>' +
        F.utama.map((b, i) => '<tr data-baris="' + i + '"><td class="no">' + (i + 1) + '</td><td class="nm" title="' + esc(b.name) + '">' + esc(b.name) + '</td>' +
          '<td><input class="kontrol" data-massal="' + i + '" value="' + esc(F.tujuanMassal[b.name + b.size] || '') + '" placeholder="Nama penerima / instansi"></td></tr>').join('') +
        '</tbody></table></div>', { untuk: false, bantuan: F.utama.length + ' surat dalam satu tiket. Nomor surat per baris diisi admin.' });
    }
  }
  berkas += isian('lampiran', 'Lampiran', zonaUnggah('lampiran', 'Unggah lampiran', 'surat', true), { untuk: false, opsional: true, bantuan: F.lampiran.length ? 'Jumlah lampiran: ' + F.lampiran.length + ' berkas' : '' }) +
    centang('lampiran_menyusul', 'Lampiran menyusul, atau admin yang menyiapkan');
  html += bagian(++no, perluBerkas ? 'Berkas' : 'Lampiran', perluBerkas ? '' : 'Admin akan menyusun surat dari isian di atas. Lampirkan bahan pendukung bila ada.', berkas);

  // Kegiatan
  const bukaKegiatan = kegiatanWajib || !!n._kegiatan;
  html += bagian(++no, 'Kegiatan terkait', kegiatanWajib ? 'Wajib untuk kategori ' + esc(n.kategori) + ', karena isian ini juga diminta E-Office.' : 'Isi bila surat ini terkait kegiatan bertanggal.',
    (kegiatanWajib ? '' : centang('_kegiatan', 'Surat ini terkait kegiatan', true)) +
    (bukaKegiatan ?
      isian('kegiatan_nama', 'Nama kegiatan', masukan('kegiatan_nama', 'text', ' placeholder="Contoh: International Education Festival 2026"')) +
      '<div class="baris-3">' +
        isian('kegiatan_tanggal', 'Tanggal', masukan('kegiatan_tanggal', 'date')) +
        isian('kegiatan_waktu_mulai', 'Mulai', masukan('kegiatan_waktu_mulai', 'time')) +
        isian('kegiatan_waktu_selesai', 'Selesai', masukan('kegiatan_waktu_selesai', 'time'), { opsional: true }) +
      '</div>' +
      isian('kegiatan_lokasi', 'Lokasi', masukan('kegiatan_lokasi', 'text', ' placeholder="Contoh: Auditorium Andi Hakim Nasoetion, Kampus IPB Dramaga"')) +
      isian('kegiatan_deskripsi', 'Deskripsi acara', areaTeks('kegiatan_deskripsi', 'Gambaran singkat acara', 3), { opsional: true })
    : ''));

  html += bagianPrioritas(++no);

  // Detail tambahan
  const perluEo = n.perlu_eoffice === undefined ? !!(kat && kat.perlu_eoffice) : !!n.perlu_eoffice;
  F.nilai.perlu_eoffice = perluEo;
  html += bagian(++no, 'Detail tambahan', 'Semua isian di bagian ini opsional.',
    '<div class="baris-2">' +
      isian('nomor_surat', 'Nomor surat', masukan('nomor_surat', 'text', ' placeholder="Bila sudah punya nomor"'), { opsional: true }) +
      isian('narahubung', 'Narahubung', masukan('narahubung', 'text', ' placeholder="Nama dan nomor HP"'), { opsional: true }) +
    '</div>' +
    isian('tembusan', 'Tembusan', masukan('tembusan', 'text', ' placeholder="Pisahkan dengan koma"'), { opsional: true }) +
    '<div style="display:grid;gap:10px">' + centang('emeterai', 'Perlu e-meterai') + centang('perlu_eoffice', 'Perlu dientri ke E-Office') + '</div>' +
    isian('catatan_pemohon', 'Catatan untuk admin', areaTeks('catatan_pemohon', '', 3), { opsional: true }));

  if (t === 'siap_disign') {
    html += bagian(++no, 'Pernyataan', '',
      centang('kirim_langsung_eoffice', 'Setelah ber-TTD, langsung kirim ke E-Office tanpa menunggu persetujuan saya') +
      isian('pernyataan_dibaca', '', centang('pernyataan_dibaca', '<b>Saya sudah membaca dan bertanggung jawab atas isi surat ini.</b> Pernyataan ini tercatat beserta nama dan waktunya.'), { kelas: 'centang-wajib', untuk: false }));
  }
  return html;
}

/* ---------------------------------------------------------------- DESAIN */
function bagianDesain() {
  const n = F.nilai, t = F.tipe;
  let no = 0;
  let html = F.catat ? bagianCatat(++no) : '';
  const fmt = S.ref.formatDesain.length ? S.ref.formatDesain : [];
  const kelompok = [];
  fmt.forEach(f => { let g = kelompok.find(x => x.k === f.kelompok); if (!g) kelompok.push(g = { k: f.kelompok, o: [] }); g.o.push({ v: f.nama, l: f.nama, uk: f.ukuran }); });
  const formatTerpilih = fmt.find(f => f.nama === n.format_ukuran);
  const video = formatTerpilih && formatTerpilih.kelompok === 'Video';
  const lain = /^Ukuran lain/.test(n.format_ukuran || '');

  html += bagian(++no, 'Tipe pengajuan', '',
    isian('tipe', '', segmen('tipe', ['desain_baru', 'lanjutkan_draft'].map(v => ({ v, l: TIPE_LABEL[v], ket: TIPE_INFO[v].ket }))), { untuk: false }));

  html += bagian(++no, 'Format & penempatan', '"Format" menjawab sebesar apa dan berbentuk apa; "penempatan" menjawab akan dipakai di mana.',
    isian('format_ukuran', 'Format & ukuran', '<div style="display:grid;gap:12px">' + kelompok.map(g => '<div class="chip-kelompok"><span class="kel">' + esc(g.k) + '</span>' + chipPilih('format_ukuran', g.o, false, true) + '</div>').join('') + '</div>', { untuk: false }) +
    (lain ? isian('format_lain', 'Ukuran yang dibutuhkan', masukan('format_lain', 'text', ' placeholder="Contoh: Umbul-umbul 90 × 400 cm"')) : '') +
    (video ? '<div class="baris-2">' + isian('durasi_video', 'Durasi', masukan('durasi_video', 'text', ' placeholder="Contoh: 30–60 detik"'), { opsional: true }) +
      isian('link_bahan_mentah', 'Link bahan mentah', masukan('link_bahan_mentah', 'url', ' placeholder="Link Drive berisi video/foto mentah"'), { opsional: true }) + '</div>' : '') +
    isian('penempatan', 'Penempatan', chipPilih('penempatan', S.ref.penempatan, true), { untuk: false, bantuan: 'Boleh pilih lebih dari satu.' }));

  html += bagian(++no, 'Isi desain', '',
    isian('perihal', 'Tema / judul', masukan('perihal', 'text', ' placeholder="Contoh: Pengumuman International Education Festival 2026" maxlength="200"')) +
    isian('substansi', 'Substansi / konteks', areaTeks('substansi', 'Untuk apa desain ini, siapa sasarannya, dan pesan utamanya apa?', 4)) +
    isian('teks_wajib', 'Teks yang wajib ada', areaTeks('teks_wajib', 'Tulis persis teks yang harus tampil: judul, tanggal, tempat, tautan pendaftaran, dll.', 4)) +
    '<div class="baris-2">' +
      isian('bahasa_desain', 'Bahasa', pilihan('bahasa_desain', ['Indonesia', 'Inggris', 'Keduanya'], 'Pilih bahasa…'), { opsional: true }) +
      isian('jumlah_varian', 'Jumlah varian', masukan('jumlah_varian', 'number', ' min="1" max="10" placeholder="1"'), { opsional: true }) +
    '</div>' +
    isian('gaya', 'Gaya yang diharapkan', masukan('gaya', 'text', ' placeholder="Contoh: formal, warna IPB, banyak ruang kosong"'), { opsional: true }));

  html += bagian(++no, t === 'lanjutkan_draft' ? 'Draf & referensi' : 'Referensi', t === 'lanjutkan_draft' ? 'Unggah berkas draf atau tempel link-nya (salah satu cukup).' : 'Contoh desain yang Anda sukai, logo mitra, atau foto yang perlu dipakai.',
    (t === 'lanjutkan_draft' ? isian('draft', 'Berkas draf', zonaUnggah('draft', 'Unggah berkas draf', 'desain', true), { untuk: false }) +
      isian('link_draft', 'Link draf', masukan('link_draft', 'url', ' placeholder="Link Canva, Figma, atau Drive"'), { bantuan: 'Pastikan link bisa dibuka oleh admin (akses "siapa saja yang memiliki link").' }) : '') +
    isian('referensi', 'Berkas referensi', zonaUnggah('referensi', 'Unggah referensi', 'desain', true), { untuk: false, opsional: true }) +
    isian('link_referensi', 'Link referensi', masukan('link_referensi', 'url', ' placeholder="Link Pinterest, Instagram, Drive, dll."'), { opsional: true }));

  html += bagian(++no, 'Kegiatan terkait', 'Opsional. Isi bila desain ini untuk kegiatan bertanggal.',
    '<div class="baris-2">' +
      isian('kegiatan_nama', 'Nama kegiatan', masukan('kegiatan_nama', 'text'), { opsional: true }) +
      isian('kegiatan_tanggal', 'Tanggal kegiatan', masukan('kegiatan_tanggal', 'date'), { opsional: true }) +
    '</div>');

  html += bagianPrioritas(++no);
  html += bagian(++no, 'Catatan untuk admin', '', isian('catatan_pemohon', '', areaTeks('catatan_pemohon', 'Opsional', 3)));
  return html;
}

/* ---------------------------------------------------------------- perilaku */
let jedaDraf = null;
function pasangPerilakuForm() {
  const form = $('#formPengajuan');
  const baca = el => {
    const k = el.name;
    if (!k) return;
    if (el.type === 'checkbox' && $$('input[name="' + k + '"]', form).length > 1) F.nilai[k] = $$('input[name="' + k + '"]:checked', form).map(x => x.value);
    else if (el.type === 'checkbox') F.nilai[k] = el.checked;
    else if (el.type === 'radio') { if (el.checked) F.nilai[k] = el.value; }
    else F.nilai[k] = el.value;
  };
  form.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.massal !== undefined) { const b = F.utama[Number(el.dataset.massal)]; F.tujuanMassal[b.name + b.size] = el.value; }
    else baca(el);
    hapusTandaGalat(el);
    if (el.name === 'batas_keperluan') cekMepet();
    simpanDraf();
    gambarPanelKanan();
  });
  form.addEventListener('change', e => {
    const el = e.target;
    if (el.type === 'file') { tambahBerkas(el.dataset.daftar, el.files); el.value = ''; return; }
    baca(el);
    if (el.name === 'tipe') {
      history.replaceState(null, '', (F.catat ? '#catat/' : '#ajukan/') + (F.jenis === 'Surat' ? 'surat' : 'desain') + '/' + el.value);
      F.tipe = el.value;
    }
    if (el.name === 'kategori') { const k = S.ref.kategori.find(x => x.kategori === el.value); F.nilai.perlu_eoffice = !!(k && k.perlu_eoffice); }
    if (el.name === 'format_ukuran' && !/^Ukuran lain/.test(el.value)) F.nilai.format_lain = '';
    simpanDraf();
    if (el.dataset.ubah) { const y = window.scrollY; gambarForm(); window.scrollTo(0, y); }
    else gambarPanelKanan();
  });
  form.addEventListener('submit', e => { e.preventDefault(); kirimPengajuan(); });
  $$('.zona', form).forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('seret'); });
    z.addEventListener('dragleave', () => z.classList.remove('seret'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('seret'); tambahBerkas(z.dataset.zona, e.dataTransfer.files); });
  });
  cekMepet();
}

function simpanDraf() {
  if (!F || !F.kunciDraf) return;
  clearTimeout(jedaDraf);
  jedaDraf = setTimeout(() => simpan.set(F.kunciDraf, F.nilai), 400);
}
function kosongkanForm() {
  simpan.del(F.kunciDraf);
  F = null;
  jalankanRute();
}

function tambahBerkas(daftar, files) {
  const batas = (Number((S.ref.pengaturan || {}).batas_unggah_mb) || 20) * 1048576;
  const ganda = daftar !== 'utama' || (F.nilai.massal && (F.tipe === 'draft_saya' || F.tipe === 'siap_disign'));
  const hanyaPdf = daftar === 'utama' && F.tipe === 'siap_disign';
  const bolehSurat = /^(pdf|docx?|jpe?g|png)$/i;
  let ditolak = [];
  Array.from(files || []).forEach(f => {
    if (f.size > batas) { ditolak.push(f.name + ' (lebih dari ' + (batas / 1048576) + ' MB, tempel link Drive saja)'); return; }
    if (hanyaPdf && !/^pdf$/i.test(ekstensi(f.name))) { ditolak.push(f.name + ' (tipe Siap DiSign harus PDF)'); return; }
    if ((daftar === 'utama' || daftar === 'lampiran') && F.jenis === 'Surat' && !bolehSurat.test(ekstensi(f.name))) { ditolak.push(f.name + ' (format tidak didukung)'); return; }
    if (F[daftar].some(x => x.name === f.name && x.size === f.size)) return;
    if (ganda) F[daftar].push(f); else F[daftar] = [f];
  });
  if (ditolak.length) toast('Tidak ditambahkan: ' + ditolak.join('; '), 'salah');
  delete F.galat[daftar];
  const y = window.scrollY; gambarForm(); window.scrollTo(0, y);
}
function hapusBerkas(daftar, i) {
  F[daftar].splice(i, 1);
  const y = window.scrollY; gambarForm(); window.scrollTo(0, y);
}

function hariKerjaBerikut() {
  const d = hariIni(); d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}
function cekMepet() {
  const w = $('#peringatanMepet'); if (!w) return;
  const v = F.nilai.batas_keperluan;
  w.innerHTML = v && keTanggal(v) < hariKerjaBerikut() && keTanggal(v) >= hariIni()
    ? '<div class="peringatan" style="margin-top:4px">' + ik('awas') + '<span>Waktunya kurang dari 1 hari kerja. Pengajuan tetap bisa dikirim, tetapi mohon kabari admin agar bisa didahulukan.</span></div>' : '';
}

/* ---------------------------------------------------------------- validasi (sama dengan server + berkas) */
function validasiForm() {
  const n = F.nilai, k = {}, t = F.tipe;
  const kosong = f => !String(n[f] === undefined || n[f] === null ? '' : n[f]).trim();
  const wajib = (f, pesan) => { if (kosong(f)) k[f] = pesan || 'Wajib diisi.'; };
  if (F.catat) { wajib('atas_nama', 'Pilih atas nama siapa pengajuan ini.'); wajib('sumber', 'Pilih sumber pengajuan.'); }
  if (F.jenis === 'Surat') {
    wajib('perihal'); wajib('kategori', 'Pilih kategori surat.'); wajib('penandatangan', 'Pilih penandatangan.');
    wajib('tujuan'); wajib('ringkasan');
    if (t === 'draft_saya' && !(n.aksi_draft || []).length) k.aksi_draft = 'Pilih minimal satu aksi yang dibutuhkan.';
    if (t !== 'buat_dari_nol' && !F.utama.length && !F.edit) k.utama = 'Unggah berkas surat.';
    if (!F.edit && n.massal && (t === 'draft_saya' || t === 'siap_disign') && F.utama.length) {
      const kurang = F.utama.filter(b => !String(F.tujuanMassal[b.name + b.size] || '').trim()).length;
      if (kurang) k.tujuan_massal = kurang + ' baris belum diisi tujuannya.';
    }
    const kat = S.ref.kategori.find(x => x.kategori === n.kategori);
    if ((kat && kat.blok_kegiatan === 'wajib') || n._kegiatan) {
      wajib('kegiatan_nama', 'Nama kegiatan wajib diisi.'); wajib('kegiatan_tanggal', 'Tanggal kegiatan wajib diisi.');
      wajib('kegiatan_waktu_mulai', 'Waktu mulai wajib diisi.'); wajib('kegiatan_lokasi', 'Lokasi wajib diisi.');
    }
    if (t === 'siap_disign' && !n.pernyataan_dibaca) k.pernyataan_dibaca = 'Centang pernyataan ini sebelum mengirim.';
  } else {
    wajib('format_ukuran', 'Pilih format & ukuran.');
    if (/^Ukuran lain/.test(n.format_ukuran || '')) wajib('format_lain', 'Tuliskan ukuran yang dibutuhkan.');
    if (!(n.penempatan || []).length) k.penempatan = 'Pilih minimal satu penempatan.';
    wajib('perihal', 'Tema/judul wajib diisi.'); wajib('substansi', 'Substansi/konteks wajib diisi.');
    wajib('teks_wajib', 'Tuliskan teks yang wajib ada pada desain.');
    if (t === 'lanjutkan_draft' && !F.edit && !F.draft.length && kosong('link_draft')) k.draft = 'Unggah berkas draf atau isi link draf.';
  }
  if (n.prioritas === 'Biasa') { if (!/^\d{4}-\d{2}$/.test(n.bulan_keperluan || '')) k.bulan_keperluan = 'Pilih bulan keperluan.'; }
  else {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(n.batas_keperluan || '')) k.batas_keperluan = 'Pilih tanggal batas keperluan.';
    else if (keTanggal(n.batas_keperluan) < hariIni()) k.batas_keperluan = 'Tanggal sudah lewat.';
    if (n.prioritas === 'Mendesak') wajib('alasan_mendesak', 'Tuliskan alasan singkat mengapa mendesak.');
  }
  return k;
}

function tandaiGalat() {
  const k = F.galat || {};
  // Buang galat untuk isian yang sudah tidak tampil (misalnya setelah ganti tipe)
  Object.keys(k).forEach(x => { if (!$('#formPengajuan .isian[data-kolom="' + x + '"]')) delete k[x]; });
  $$('#formPengajuan .isian[data-kolom]').forEach(el => {
    const p = k[el.dataset.kolom];
    el.classList.toggle('salah', !!p);
    const m = $('.pesan-salah', el); if (m) m.textContent = p || '';
  });
  const jml = Object.keys(k).length;
  const w = $('#galatRingkas');
  if (w) w.innerHTML = jml ? '<div class="galat-ringkas">' + ik('awas') + '<span>Ada ' + jml + ' isian yang perlu dilengkapi. Bagian yang bertanda merah perlu diperbaiki.</span></div>' : '';
}
function hapusTandaGalat(el) {
  const box = el.closest('.isian[data-kolom]');
  if (box && F.galat[box.dataset.kolom]) { delete F.galat[box.dataset.kolom]; tandaiGalat(); }
}

/* ---------------------------------------------------------------- panel kanan */
function gambarPanelKanan() {
  const w = $('#panelKanan'); if (!w) return;
  const n = F.nilai, surat = F.jenis === 'Surat';
  const cek = [
    ['Perihal / tema', !!String(n.perihal || '').trim()],
    surat ? ['Kategori & penandatangan', !!(n.kategori && n.penandatangan)] : ['Format & penempatan', !!(n.format_ukuran && (n.penempatan || []).length)],
    surat ? ['Tujuan & ringkasan', !!(String(n.tujuan || '').trim() && String(n.ringkasan || '').trim())] : ['Substansi & teks wajib', !!(String(n.substansi || '').trim() && String(n.teks_wajib || '').trim())],
    ['Prioritas & waktu', n.prioritas === 'Biasa' ? !!n.bulan_keperluan : !!n.batas_keperluan && (n.prioritas !== 'Mendesak' || !!String(n.alasan_mendesak || '').trim())]
  ];
  if (surat && F.tipe !== 'buat_dari_nol' && !F.edit) cek.push(['Berkas surat', F.utama.length > 0]);
  if (!surat && F.tipe === 'lanjutkan_draft' && !F.edit) cek.push(['Draf (berkas atau link)', F.draft.length > 0 || !!String(n.link_draft || '').trim()]);
  if (F.tipe === 'siap_disign') cek.push(['Pernyataan', !!n.pernyataan_dibaca]);
  if (F.catat) cek.unshift(['Atas nama & sumber', !!(n.atas_nama && n.sumber)]);
  const ok = cek.filter(c => c[1]).length;
  const waktu = n.prioritas === 'Biasa' ? fmt.bulan(n.bulan_keperluan) : (n.batas_keperluan ? fmt.hari(n.batas_keperluan) : '—');
  const pdf = (F.utama[0] && /^pdf$/i.test(ekstensi(F.utama[0].name))) ? F.utama[0] : (F.draft[0] && /^pdf$/i.test(ekstensi(F.draft[0].name)) ? F.draft[0] : null);
  if (F._urlPdf && (!pdf || F._pdfAsal !== pdf)) { URL.revokeObjectURL(F._urlPdf); F._urlPdf = null; }
  if (pdf && !F._urlPdf) { F._urlPdf = URL.createObjectURL(pdf); F._pdfAsal = pdf; }
  const jumlahBerkas = F.utama.length + F.lampiran.length + F.referensi.length + F.draft.length;

  // Tombol kirim TIDAK digambar ulang, supaya klik tidak hilang saat isian berubah (blur → change)
  if (!$('#panelRingkas', w)) {
    w.innerHTML = '<div class="kartu ringkasan-kartu"><div id="panelRingkas" style="display:grid;gap:16px"></div>' +
      '<button class="tbl utama penuh" type="submit" id="tblKirim">' + (F.edit ? 'Simpan perubahan' : F.catat ? 'Simpan pengajuan' : 'Kirim pengajuan') + '</button>' +
      '<a class="tbl hantu penuh" href="' + (F.edit ? '#tiket/' + F.edit : F.catat ? '#catat' : '#ajukan') + '">Batal</a></div><div id="panelPratinjau"></div>';
  }
  $('#panelRingkas', w).innerHTML =
      '<h2>Ringkasan</h2>' +
      '<div style="display:grid;gap:6px">' +
        '<div class="rk-baris"><span class="k">Jenis</span><span class="v">' + F.jenis + ' · ' + esc(TIPE_LABEL[F.tipe]) + (n.massal && surat ? ' · massal' : '') + '</span></div>' +
        (F.catat ? '<div class="rk-baris"><span class="k">Atas nama</span><span class="v">' + esc(n.atas_nama || '—') + (n.sumber ? ' <span class="lencana sumber">' + esc(n.sumber) + '</span>' : '') + '</span></div>' : '') +
        '<div class="rk-baris"><span class="k">Perihal</span><span class="v">' + esc(n.perihal || '—') + '</span></div>' +
        '<div class="rk-baris"><span class="k">Prioritas</span><span class="v"><span class="pill p-' + esc(n.prioritas) + '">' + esc(n.prioritas) + '</span></span></div>' +
        '<div class="rk-baris"><span class="k">' + (n.prioritas === 'Biasa' ? 'Bulan' : 'Batas') + '</span><span class="v">' + waktu + '</span></div>' +
        '<div class="rk-baris"><span class="k">Berkas</span><span class="v">' + (jumlahBerkas ? jumlahBerkas + ' berkas' : '—') + '</span></div>' +
      '</div>' +
      '<div class="kemajuan"><div class="ket">' + ok + ' dari ' + cek.length + ' bagian wajib lengkap</div><div class="meteran"><span style="width:' + Math.round(ok / cek.length * 100) + '%"></span></div></div>' +
      '<div class="daftar-cek"><ul>' + cek.map(c => '<li class="' + (c[1] ? 'ok' : '') + '">' + ik(c[1] ? 'cek' : 'jam') + c[0] + '</li>').join('') + '</ul></div>';
  const prt = $('#panelPratinjau', w);
  const kunciPrt = pdf ? pdf.name + pdf.size : '';
  if (prt.dataset.kunci !== kunciPrt) {
    prt.dataset.kunci = kunciPrt;
    prt.innerHTML = pdf ? '<div class="pratinjau"><div class="judul-prt">' + ik('mata') + '<span>Pratinjau · ' + esc(pdf.name) + '</span></div><iframe src="' + F._urlPdf + '#toolbar=0&navpanes=0" title="Pratinjau PDF"></iframe></div>' : '';
  }
}

/* ---------------------------------------------------------------- kirim */
function payloadPengajuan() {
  const n = F.nilai, d = { jenis: F.jenis, tipe: F.tipe };
  const salin = ['perihal', 'kategori', 'penandatangan', 'tujuan', 'ringkasan', 'tembusan', 'narahubung', 'nomor_surat', 'tanggal_surat',
    'prioritas', 'batas_keperluan', 'bulan_keperluan', 'alasan_mendesak', 'catatan_pemohon',
    'kegiatan_nama', 'kegiatan_tanggal', 'kegiatan_waktu_mulai', 'kegiatan_waktu_selesai', 'kegiatan_lokasi', 'kegiatan_deskripsi',
    'substansi', 'teks_wajib', 'gaya', 'bahasa_desain', 'jumlah_varian', 'durasi_video', 'link_bahan_mentah', 'link_referensi', 'link_draft'];
  salin.forEach(k => { if (n[k] !== undefined && n[k] !== '') d[k] = n[k]; });
  ['emeterai', 'perlu_eoffice', 'kirim_langsung_eoffice', 'pernyataan_dibaca', 'lampiran_menyusul'].forEach(k => { d[k] = !!n[k]; });
  if (F.jenis === 'Surat') {
    const kat = S.ref.kategori.find(x => x.kategori === n.kategori);
    if (!(kat && kat.blok_kegiatan === 'wajib') && !n._kegiatan) ['kegiatan_nama', 'kegiatan_tanggal', 'kegiatan_waktu_mulai', 'kegiatan_waktu_selesai', 'kegiatan_lokasi', 'kegiatan_deskripsi'].forEach(k => delete d[k]);
    if (F.tipe === 'draft_saya') d.aksi_draft = n.aksi_draft || [];
    d.massal = !!n.massal && (F.tipe === 'draft_saya' || F.tipe === 'siap_disign');
    if (d.massal) d.baris_massal = F.utama.map(b => ({ nama_berkas_asal: b.name, tujuan: F.tujuanMassal[b.name + b.size] || '' }));
  } else {
    d.format_ukuran = /^Ukuran lain/.test(n.format_ukuran || '') ? 'Ukuran lain: ' + String(n.format_lain || '').trim() : n.format_ukuran;
    d.penempatan = (n.penempatan || []).join('; ');
  }
  if (F.catat) { d.atas_nama = n.atas_nama; d.sumber = n.sumber; }
  return d;
}

function daftarUnggah(tiket) {
  const n = F.nilai;
  const dasar = nama => nama.replace(/\.[A-Za-z0-9]{1,6}$/, '');
  const perihal = String(n.perihal || '').replace(/[\/\\:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
  const tahapUtama = { draft_saya: 'Draft', siap_disign: 'Siap TTD', ttd_basah: 'Final' }[F.tipe];
  const daftar = [];
  const massal = n.massal && (F.tipe === 'draft_saya' || F.tipe === 'siap_disign');
  F.utama.forEach((b, i) => daftar.push({ berkas: b, tahap: tahapUtama, baris_massal: massal ? String(i + 1) : '',
    nama_file: massal ? tiket + '_' + pad2(i + 1) + '_' + dasar(b.name) : tiket + '_' + perihal }));
  F.draft.forEach(b => daftar.push({ berkas: b, tahap: 'Draft', nama_file: tiket + '_Draf_' + dasar(b.name) }));
  F.lampiran.forEach(b => daftar.push({ berkas: b, tahap: 'Lampiran', nama_file: tiket + '_Lampiran_' + dasar(b.name) }));
  F.referensi.forEach(b => daftar.push({ berkas: b, tahap: 'Referensi', nama_file: tiket + '_Referensi_' + dasar(b.name) }));
  return daftar.map(x => Object.assign(x, { status: 'tunggu' }));
}

const keBase64 = file => new Promise((ok, gagal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => gagal(new Error('Berkas tidak dapat dibaca.'));
  r.readAsDataURL(file);
});

async function kirimPengajuan() {
  if (F.sedangKirim) return;
  F.galat = validasiForm();
  tandaiGalat();
  if (Object.keys(F.galat).length) {
    const pertama = $('#formPengajuan .isian.salah');
    if (pertama) { pertama.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = $('input,select,textarea', pertama); if (f && f.type !== 'file') setTimeout(() => f.focus({ preventScroll: true }), 300); }
    return;
  }
  F.sedangKirim = true;
  const tbl = $('#tblKirim'); tbl.disabled = true; tbl.innerHTML = '<span class="putar"></span>Menyimpan…';
  let tiket;
  try {
    const muatan = payloadPengajuan();
    if (F.edit) { delete muatan.massal; delete muatan.baris_massal; muatan.tiket = F.edit; }
    const hasil = await api(F.edit ? 'suntingPengajuan' : F.catat ? 'catatPengajuan' : 'buatPengajuan', muatan);
    tiket = hasil.tiket;
  } catch (e) {
    F.sedangKirim = false; tbl.disabled = false; tbl.textContent = F.edit ? 'Simpan perubahan' : F.catat ? 'Simpan pengajuan' : 'Kirim pengajuan';
    if (e.kolom && Object.keys(e.kolom).length) { F.galat = e.kolom; tandaiGalat(); const p = $('#formPengajuan .isian.salah'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    else toast(e.message, 'salah');
    return;
  }
  const antrian = daftarUnggah(tiket);
  if (antrian.length) await jalankanUnggah(tiket, antrian);
  if (F.edit) {
    const gagal = antrian.filter(x => x.status !== 'ok').length;
    F = null; S.daftar = null;
    toast('Perubahan tersimpan' + (gagal ? ', ' + gagal + ' berkas belum terunggah' : ''), gagal ? 'salah' : 'ok');
    location.hash = '#tiket/' + tiket;
    return;
  }
  selesaiKirim(tiket, antrian.filter(x => x.status !== 'ok'));
}

function jalankanUnggah(tiket, antrian) {
  return new Promise(selesai => {
    const lap = document.createElement('div');
    lap.className = 'lapisan';
    document.body.appendChild(lap);
    const gambar = (akhir) => {
      const ok = antrian.filter(x => x.status === 'ok').length, gagal = antrian.filter(x => x.status === 'gagal');
      lap.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="judulUnggah">' +
        '<div><h2 id="judulUnggah">' + (akhir ? (gagal.length ? 'Sebagian berkas belum terunggah' : 'Semua berkas terunggah') : 'Mengunggah berkas…') + '</h2>' +
        '<p class="ket" style="margin-top:4px">Pengajuan <b>' + esc(tiket) + '</b> sudah tersimpan. ' + ok + ' dari ' + antrian.length + ' berkas selesai.</p></div>' +
        '<div class="meteran"><span style="width:' + Math.round(ok / antrian.length * 100) + '%"></span></div>' +
        '<div style="display:grid;gap:8px;max-height:280px;overflow:auto">' + antrian.map(x =>
          '<div class="progres-item ' + x.status + '">' + (x.status === 'proses' ? '<span class="putar"></span>' : x.status === 'ok' ? ik('cek') : x.status === 'gagal' ? ik('awas') : ik('jam')) +
          '<span class="nm" title="' + esc(x.berkas.name) + '">' + esc(x.berkas.name) + '</span>' +
          '<span class="st">' + ({ tunggu: 'menunggu', proses: 'mengunggah', ok: 'selesai', gagal: 'gagal' })[x.status] + '</span></div>').join('') + '</div>' +
        (akhir && gagal.length ? '<p class="ket">' + esc(gagal[0].pesan || '') + '</p><div class="aksi"><button class="tbl" id="tblLewati">Lanjutkan tanpa berkas ini</button><button class="tbl utama" id="tblUlang">Coba lagi</button></div>' : '') +
        '</div>';
      if (akhir && gagal.length) {
        $('#tblUlang', lap).onclick = () => { gagal.forEach(x => { x.status = 'tunggu'; }); proses(); };
        $('#tblLewati', lap).onclick = () => { lap.remove(); selesai(); };
      }
    };
    async function proses() {
      for (const x of antrian) {
        if (x.status === 'ok') continue;
        x.status = 'proses'; gambar(false);
        try {
          const data_base64 = await keBase64(x.berkas);
          await api('unggahBerkas', { tiket, tahap: x.tahap, baris_massal: x.baris_massal || '', nama_file: x.nama_file, nama_asli: x.berkas.name, mime: x.berkas.type || '', data_base64 });
          x.status = 'ok';
        } catch (e) { x.status = 'gagal'; x.pesan = e.message; }
      }
      const adaGagal = antrian.some(x => x.status === 'gagal');
      gambar(true);
      if (!adaGagal) setTimeout(() => { lap.remove(); selesai(); }, 500);
    }
    proses();
  });
}

function bukaModal(o) {
  tutupMenu();
  const lap = document.createElement('div');
  lap.className = 'lapisan';
  lap.innerHTML = '<form class="modal" role="dialog" aria-modal="true" novalidate>' +
    '<div><h2>' + o.judul + '</h2>' + (o.ket ? '<p class="ket" style="margin-top:4px">' + o.ket + '</p>' : '') + '</div>' +
    '<div class="modal-isi" style="display:grid;gap:16px">' + (o.isi || '') + '</div>' +
    '<div class="aksi"><button type="button" class="tbl" data-batal>' + (o.labelBatal || 'Batal') + '</button>' +
    (o.labelOk ? '<button type="submit" class="tbl ' + (o.bahaya ? 'bahaya-isi' : 'utama') + '" data-ok>' + o.labelOk + '</button>' : '') + '</div></form>';
  document.body.appendChild(lap);
  const form = $('form', lap);
  const tutup = () => { lap.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') tutup(); };
  document.addEventListener('keydown', esc);
  $('[data-batal]', lap).onclick = tutup;
  lap.addEventListener('mousedown', e => { if (e.target === lap) tutup(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!o.aksi) { tutup(); return; }
    $$('.isian', form).forEach(x => x.classList.remove('salah'));
    const tbl = $('[data-ok]', lap); const label = tbl.innerHTML;
    tbl.disabled = true; tbl.innerHTML = '<span class="putar"></span>' + label;
    try {
      const nilai = {};
      $$('[name]', form).forEach(el => { nilai[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
      await o.aksi(nilai, lap);
      tutup();
    } catch (err) {
      tbl.disabled = false; tbl.innerHTML = label;
      if (err.kolom && Object.keys(err.kolom).length) {
        Object.keys(err.kolom).forEach(k => { const box = $('.isian[data-kolom="' + k + '"]', form); if (box) { box.classList.add('salah'); $('.pesan-salah', box).textContent = err.kolom[k]; } });
        if (!Object.keys(err.kolom).some(k => $('.isian[data-kolom="' + k + '"]', form))) toast(err.message, 'salah');
      } else toast(err.message, 'salah');
    }
  });
  if (o.siap) o.siap(lap);
  const f = $('input:not([type=hidden]),select,textarea', form);
  setTimeout(() => (f || $('[data-ok]', lap) || $('[data-batal]', lap)).focus(), 30);
  return { tutup, el: lap };
}
const isianModal = (k, label, kontrol, opt) => '<div class="isian" data-kolom="' + k + '"><label for="m-' + k + '">' + label + (opt && opt.opsional ? '<span class="opsional">opsional</span>' : '') + '</label>' + kontrol + (opt && opt.bantuan ? '<span class="bantuan">' + opt.bantuan + '</span>' : '') + '<span class="pesan-salah"></span></div>';

  tipe: 'Tipe', estimasi_selesai: 'Estimasi selesai', catatan_admin: 'Catatan admin', status: 'Status', substatus: 'Tahap proses'
};
const SUFIKS_TAHAP = { Draft: '', 'Siap TTD': '_ttd', Final: '_ttd_Signed', 'E-meterai': '_ttd_Signed_materai', Lampiran: '_Lampiran', Referensi: '_Referensi' };
const bersihNama = t => String(t || '').replace(/[\/\\:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim();
/** Pola baku: {nomor}_{perihal}{_ttd…}; tanpa nomor: {tiket}_{perihal}; massal: + _{tujuan} */
function namaBaku(p, tahap, baris) {
  const nomor = baris ? String(baris.nomor_surat || '').split('/')[0] : p.nomor_urut || String(p.nomor_surat || '').split('/')[0];
  const awal = /^\d+$/.test(nomor) ? nomor : p.tiket;
  const perihal = bersihNama(p.perihal).slice(0, 80);
  const tujuan = baris ? '_' + bersihNama(baris.tujuan).slice(0, 40) : '';
  if (p.jenis === 'Desain') return p.tiket + '_' + perihal + '_' + ({ Draft: 'draf', 'Siap TTD': 'siap', Final: 'final', 'E-meterai': 'final', Lampiran: 'lampiran', Referensi: 'referensi' }[tahap] || 'berkas');
  return awal + '_' + perihal + tujuan + (SUFIKS_TAHAP[tahap] || '');
}
const TAHAP_KELAS = { 'E-meterai': 's-Selesai', Final: 's-Selesai', 'Siap TTD': 's-Antre', Draft: 's-Antre', Lampiran: 's-Dibatalkan', Referensi: 's-Dibatalkan' };

function tambahHariKerja(n) {
  const d = hariIni();
  let sisa = n;
  while (sisa > 0) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) sisa--; }
  return d;
}
function usulanEstimasi(p) {
  const pg = S.ref.pengaturan || {};
  if (p.prioritas === 'Mendesak') return isoTanggal(tambahHariKerja(Number(pg.estimasi_mendesak_hari) || 1));
  if (p.prioritas === 'Terjadwal') {
    const usul = tambahHariKerja(Number(pg.estimasi_terjadwal_hari) || 3);
    const batas = keTanggal(p.batas_keperluan);
    return isoTanggal(batas && batas < usul && batas >= hariIni() ? batas : usul);
  }
  const ym = p.bulan_keperluan || isoBulan(new Date());
  const [y, m] = ym.split('-').map(Number);
  return isoTanggal(new Date(y, m, 0));
}
const waktuLengkap = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() + ', ' + pad2(d.getHours()) + '.' + pad2(d.getMinutes()); };

      const a = asal(r.urutan), h = hasil(r);
      return '<tr><td class="no">' + esc(r.urutan) + '</td><td><div class="tebal">' + esc(r.tujuan || '—') + '</div><div class="ket">' + esc(r.nama_berkas_asal) + '</div></td>' +
        '<td class="mono">' + (r.nomor_surat ? esc(r.nomor_surat) : '<span class="ket">belum</span>') + '</td>' +
        '<td><span class="pill ' + (r.status_baris === 'Selesai' ? 's-Selesai' : 's-Antre') + '">' + esc(r.status_baris || 'Menunggu') + '</span></td>' +
        '<td style="white-space:nowrap">' + (a ? '<button class="tbl hantu kecil" onclick="unduhBerkas(\'' + a.id + '\')" title="Berkas asal">' + ik('unduh') + 'Asal</button>' : '') +
          (h ? '<button class="tbl kecil" onclick="unduhBerkas(\'' + h.id + '\')" title="Hasil">' + ik('unduh') + 'Hasil</button>' : '') + '</td>' +
        (admin ? '<td style="white-space:nowrap"><button class="tbl hantu kecil" onclick="modalNomor(\'' + esc(r.urutan) + '\')">' + ik('pagar') + 'Nomor</button>' +
          '<button class="tbl hantu kecil" onclick="pilihUnggahAdmin(\'' + esc(r.urutan) + '\')">' + ik('unduh') + 'Hasil</button></td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div></section>';
}

function kartuIsian(u) {
  const p = D.pengajuan;
  const nilai = k => {
    const v = p[k];
    if (v === true) return 'Ya';
    if (v === false || v === '' || v === undefined || v === null || (Array.isArray(v) && !v.length)) return '';
    if (Array.isArray(v)) return v.join(', ');
    if (/tanggal|batas_keperluan|estimasi/.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmt.hari(v);
    if (k === 'bulan_keperluan') return fmt.bulan(v);
    if (/^link_/.test(k)) return '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + '</a>';
    return esc(v);
  };
  const kelompok = p.jenis === 'Surat'
    ? [['Isi surat', ['perihal', 'kategori', 'penandatangan', 'rantai_paraf', 'tujuan', 'ringkasan', 'aksi_draft', 'tembusan', 'narahubung', 'tanggal_surat']],
       ['Kegiatan', ['kegiatan_nama', 'kegiatan_tanggal', 'kegiatan_waktu_mulai', 'kegiatan_waktu_selesai', 'kegiatan_lokasi', 'kegiatan_deskripsi']],
       ['Lainnya', ['emeterai', 'perlu_eoffice', 'kirim_langsung_eoffice', 'pernyataan_dibaca', 'lampiran_menyusul', 'alasan_mendesak', 'catatan_pemohon']]]
    : [['Isi desain', ['perihal', 'format_ukuran', 'penempatan', 'substansi', 'teks_wajib', 'bahasa_desain', 'jumlah_varian', 'gaya', 'durasi_video']],
       ['Tautan', ['link_draft', 'link_referensi', 'link_bahan_mentah']],
       ['Kegiatan & catatan', ['kegiatan_nama', 'kegiatan_tanggal', 'alasan_mendesak', 'catatan_pemohon']]];
  const blok = kelompok.map(g => {
    const isi = g[1].filter(k => nilai(k)).map(k => '<div class="dl-baris"><dt>' + (k === 'perihal' && p.jenis === 'Desain' ? 'Tema / judul' : LABEL_KOLOM[k]) + '</dt><dd>' + nilai(k) + '</dd></div>').join('');
    return isi ? '<div class="kelompok-isian"><div class="kel">' + g[0] + '</div><dl class="dl">' + isi + '</dl></div>' : '';
  }).join('');
  return '<section class="kartu kartu-isi"><div class="kepala-kartu">' + ik('surat') + '<h2>Detail isian</h2></div>' +
    '<div class="pemohon-baris"><span class="avatar">' + inisial(p.pemohon) + '</span><div><div class="tebal">' + esc(p.pemohon) + '</div><div class="ket">' + esc(u.ekosistem || '') + (u.jabatan ? ' · ' + esc(u.jabatan) : '') +
      (p.atas_nama ? ' · dicatat oleh ' + esc(p.dibuat_oleh) + ' dari ' + esc(p.sumber) : '') + ' · masuk ' + waktuLengkap(p.dibuat_pada) + '</div></div></div>' +
    blok + '</section>';
}

function teksLog(l) {
  const v = x => esc(x || '—');
  const tgl = x => /^\d{4}-\d{2}-\d{2}$/.test(x || '') ? fmt.hari(x) : v(x);
  switch (l.aksi) {
    case 'buat_pengajuan': return l.catatan ? esc(l.catatan) : 'membuat pengajuan';
    case 'dibaca_pertama': return 'membuka pengajuan untuk pertama kali';
    case 'ubah_status': return 'mengubah status <b>' + v(l.dari) + '</b> → <b>' + v(l.ke) + '</b>' + (l.catatan ? ' · ' + esc(l.catatan) : '');
    case 'ubah_substatus': return l.ke ? 'tahap proses: <b>' + v(l.ke) + '</b>' : '';
    case 'ubah_catatan_admin': return 'memperbarui catatan admin';
    case 'ubah_prioritas': return 'mengubah prioritas <b>' + v(l.dari) + '</b> → <b>' + v(l.ke) + '</b>' + (l.catatan ? ' · ' + esc(l.catatan) : '');
    case 'ubah_batas_keperluan': return 'mengubah batas keperluan menjadi <b>' + (/^\d{4}-\d{2}$/.test(l.ke) ? fmt.bulan(l.ke) : tgl(l.ke)) + '</b>';
    case 'isi_estimasi': return 'mengisi estimasi selesai: <b>' + tgl(l.ke) + '</b>';
    case 'ambil_nomor': return 'memasang nomor <b class="mono">' + v(l.ke) + '</b>' + (l.catatan ? ' · ' + esc(l.catatan) : '');
    case 'lepas_nomor': return 'melepas nomor <b class="mono">' + v(l.dari) + '</b>' + (l.catatan ? ' · ' + esc(l.catatan) : '');
    case 'unggah_berkas': return 'mengunggah <b>' + v(l.ke) + '</b> · ' + esc(l.catatan);
    case 'unduh_berkas': return 'mengunduh ' + v(l.ke) + ' · ' + esc(l.catatan);
    case 'sunting_pengajuan': return 'menyunting <b>' + esc(LABEL_KOLOM[(l.catatan || '').replace('Kolom: ', '')] || l.catatan) + '</b>';
    case 'hapus_pengajuan': return 'membatalkan pengajuan · alasan: ' + esc(l.catatan);
    case 'pulihkan_pengajuan': return 'memulihkan pengajuan ke <b>' + v(l.ke) + '</b>';
    case 'tandai_eoffice': return l.ke ? 'menandai <b>sudah dientri E-Office</b>' : 'membatalkan tanda entri E-Office';
    case 'pernyataan_dibaca': return 'menyatakan sudah membaca dan bertanggung jawab atas isi surat';
    default: return esc(l.aksi.replace(/_/g, ' ')) + (l.catatan ? ' · ' + esc(l.catatan) : '');
  }
}

function kartuRiwayat() {
  const tampilUnduh = !!D.tampilUnduh;
  const item = [];
  D.log.forEach(l => {
    if (l.aksi === 'komentar' || l.aksi === 'minta_revisi') return;
    if (l.aksi === 'unduh_berkas' && !tampilUnduh) return;
    const t = teksLog(l); if (!t) return;
    item.push({ waktu: l.waktu, html: '<li class="log"><span class="titik-log"></span><div><span class="tebal">' + esc(l.pelaku) + '</span> ' + t + '<div class="ket">' + waktuLengkap(l.waktu) + (l.sumber === 'sistem' ? ' · otomatis' : '') + '</div></div></li>' });
  });
  D.komentar.forEach(k => item.push({ waktu: k.waktu, html:
    '<li class="komen' + (k.peran === 'admin' ? ' admin' : '') + (k.jenis === 'minta_revisi' ? ' revisi' : '') + '"><span class="avatar' + (k.peran === 'admin' ? ' admin' : '') + '">' + inisial(k.penulis) + '</span>' +
    '<div class="gelembung"><div class="kepala-komen"><span class="tebal">' + esc(k.penulis) + '</span>' + (k.jenis === 'minta_revisi' ? '<span class="pill p-Mendesak" style="height:20px;font-size:11px">Minta revisi</span>' : '') +
    '<span class="ket">' + waktuLengkap(k.waktu) + '</span></div><div style="white-space:pre-wrap">' + esc(k.teks) + '</div></div></li>' }));
  item.sort((a, b) => String(a.waktu).localeCompare(String(b.waktu)));
  const jmlUnduh = D.log.filter(l => l.aksi === 'unduh_berkas').length;
  return '<section class="kartu kartu-isi"><div class="kepala-kartu">' + ik('jam') + '<h2>Riwayat & komentar</h2>' +
    (jmlUnduh ? '<button class="tautan-hapus" style="margin-left:auto" onclick="D.tampilUnduh=!D.tampilUnduh;gambarDetail()">' + (tampilUnduh ? 'Sembunyikan' : 'Tampilkan') + ' ' + jmlUnduh + ' aktivitas unduh</button>' : '') + '</div>' +
    '<ol class="linimasa">' + item.map(x => x.html).join('') + '</ol>' +
    (D.pengajuan.dihapus ? '' : '<form class="kotak-komen" id="formKomen"><textarea class="kontrol" name="teks" rows="2" placeholder="Tulis komentar atau pertanyaan untuk ' + (D.izin.kelola ? 'pemohon' : 'admin') + '…"></textarea>' +
      '<button class="tbl" type="submit">' + ik('lanjut') + 'Kirim komentar</button></form>') + '</section>';
}

function kartuWaktu() {
  const p = D.pengajuan;
  const baris = (k, v) => '<div class="rk-baris"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  const n = p.prioritas !== 'Biasa' && p.batas_keperluan ? selisihHari(p.batas_keperluan) : null;
  const sisa = n === null ? '' : ' <span class="ket">(' + (n < 0 ? 'lewat ' + -n + ' hari' : n === 0 ? 'hari ini' : 'sisa ' + n + ' hari') + ')</span>';
  return '<section class="kartu ringkasan-kartu">' +
    (p.status === 'Selesai' ? '<div class="sorot-waktu ok">' + ik('cek') + '<div><div class="ket">Diselesaikan</div><div class="besar">' + waktuLengkap(p.selesai_pada) + '</div></div></div>'
      : p.antrean ? '<div class="sorot-waktu">' + ik('jam') + '<div><div class="ket">Estimasi selesai</div><div class="besar">' + (p.estimasi_selesai ? fmt.hari(p.estimasi_selesai) : 'Belum diisi admin') + '</div>' +
        '<div class="ket">Urutan ke-' + p.antrean + ' dalam antrean aktif</div></div></div>' : '') +
    '<div style="display:grid;gap:6px">' +
      baris(p.prioritas === 'Biasa' ? 'Bulan' : 'Batas', (p.prioritas === 'Biasa' ? fmt.bulan(p.bulan_keperluan) : fmt.hari(p.batas_keperluan)) + sisa) +
      baris('Masuk', waktuLengkap(p.dibuat_pada)) +
      (p.jenis === 'Surat' ? baris('Nomor', p.nomor_surat ? '<span class="mono">' + esc(p.nomor_surat) + '</span> <button class="tbl hantu kecil ikon-saja" style="height:24px;width:24px" aria-label="Salin nomor" onclick="salinTeks(\'' + esc(p.nomor_surat) + '\',\'Nomor surat disalin\')">' + ik('salin') + '</button>' : '<span class="ket">belum ada</span>') : '') +
      (p.jenis === 'Surat' ? baris('Tanggal surat', p.tanggal_surat ? fmt.hari(p.tanggal_surat) : '—') : '') +
      (p.jenis === 'Surat' && p.rantai_paraf ? baris('Paraf', esc(p.rantai_paraf) + ' → TTD') : '') +
      (p.jenis === 'Surat' && p.perlu_eoffice ? baris('E-Office', p.dientri_eoffice ? '<span style="color:var(--hijau)" class="tebal">Sudah dientri</span>' : 'Perlu dientri') : '') +
      (p.emeterai ? baris('E-meterai', 'Diperlukan') : '') +
    '</div></section>';
}

function pasangPerilakuDetail() {
  const p = D.pengajuan;
  const fk = $('#formKomen');
  if (fk) fk.addEventListener('submit', async e => {
    e.preventDefault();
    const teks = fk.teks.value.trim(); if (!teks) { fk.teks.focus(); return; }
    const b = $('button', fk); b.disabled = true;
    try { perbaruiDetail(await api('tambahKomentar', { tiket: p.tiket, teks })); toast('Komentar terkirim', 'ok'); }
    catch (err) { b.disabled = false; toast(err.message, 'salah'); }
  });
  const bp = $('#berkasPemohon');
  if (bp) bp.addEventListener('change', async () => {
    const tahap = $('#tahapPemohon').value;
    const daftar = Array.from(bp.files).map(f => ({ berkas: f, tahap, nama_file: namaBaku(p, tahap) + (tahap === 'Lampiran' || tahap === 'Referensi' ? '_' + bersihNama(f.name.replace(/\.[^.]+$/, '')) : ''), status: 'tunggu' }));
    bp.value = '';
    if (!daftar.length) return;
    await jalankanUnggah(p.tiket, daftar);
    halamanDetail([null, p.tiket]);
  });
  const fs = $('#fStatus');
  if (fs) {
    fs.status.addEventListener('change', () => { fs.substatus.disabled = fs.status.value !== 'Diproses'; if (fs.status.value === 'Diproses' && !fs.substatus.value) fs.substatus.value = 'Disusun'; });
    fs.addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('button[type=submit]', fs); b.disabled = true;
      try { perbaruiDetail(await api('ubahStatus', { tiket: p.tiket, status: fs.status.value, substatus: fs.substatus.value, catatan_admin: fs.catatan_admin.value })); toast('Status tersimpan', 'ok'); }
      catch (err) { b.disabled = false; toast(err.message, 'salah'); }
    });
  }
  const fe = $('#fEstimasi');
  if (fe) fe.addEventListener('submit', async e => {
    e.preventDefault();
    try { perbaruiDetail(await api('isiEstimasi', { tiket: p.tiket, estimasi_selesai: fe.estimasi_selesai.value })); toast('Estimasi tersimpan', 'ok'); }
    catch (err) { toast(err.message, 'salah'); }
  });
  const ce = $('#cekEoffice');
  if (ce) ce.addEventListener('change', async () => {
    try { perbaruiDetail(await api('tandaiEoffice', { tiket: p.tiket, nilai: ce.checked })); toast(ce.checked ? 'Ditandai sudah dientri E-Office' : 'Tanda E-Office dihapus', 'ok'); }
    catch (err) { ce.checked = !ce.checked; toast(err.message, 'salah'); }
  });
  const fu = $('#fUnggah');
  if (fu) fu.berkas.addEventListener('change', () => {
    const f = fu.berkas.files[0]; if (!f) return;
    siapkanUnggahAdmin(f, fu.tahap.value, fu.baris ? fu.baris.value : '');
    fu.berkas.value = '';
  });
}

/** Admin memilih berkas → nama baku diusulkan dan bisa disunting sebelum diunggah. */
function pilihUnggahAdmin(baris) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = () => { if (inp.files[0]) siapkanUnggahAdmin(inp.files[0], 'Final', baris); };
  inp.click();
}
function siapkanUnggahAdmin(file, tahap, baris) {
  const p = D.pengajuan;
  if (p.massal && !baris && (tahap === 'Final' || tahap === 'E-meterai')) { toast('Pilih baris surat untuk berkas hasil pengajuan massal.', 'salah'); return; }
  const bm = baris ? D.barisMassal.find(r => String(r.urutan) === String(baris)) : null;
  const tahapOpsi = p.jenis === 'Surat' ? ['Draft', 'Siap TTD', 'Final', 'E-meterai'] : ['Draft', 'Final'];
  const ext = ekstensi(file.name);
  bukaModal({
    judul: 'Unggah berkas', ket: esc(file.name) + ' · ' + ukuranTeks(file.size) + (bm ? ' · baris ' + esc(bm.urutan) + ' (' + esc(bm.tujuan) + ')' : ''),
    isi: isianModal('tahap', 'Tahap', '<select class="kontrol" id="m-tahap" name="tahap">' + tahapOpsi.map(t => '<option' + (t === tahap ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>',
        { bantuan: (p.massal ? 'Final/E-meterai menandai baris ini selesai; tiket selesai bila semua baris selesai.' : 'Final/E-meterai otomatis mengubah status menjadi Selesai.') }) +
      isianModal('nama_file', 'Nama berkas', '<div class="baris-tombol"><input class="kontrol" id="m-nama_file" name="nama_file" value="' + esc(namaBaku(p, tahap, bm)) + '"><span class="ket">.' + esc(ext) + '</span></div>',
        { bantuan: 'Diusulkan otomatis dari nomor + perihal + tahap. Nama asli tetap tersimpan di catatan berkas.' }),
    labelOk: 'Unggah',
    siap: lap => { $('#m-tahap', lap).addEventListener('change', e => { $('#m-nama_file', lap).value = namaBaku(p, e.target.value, bm); }); },
    aksi: async nilai => {
      if (!nilai.nama_file.trim()) throw galat('Nama berkas wajib diisi.', { nama_file: 'Nama berkas wajib diisi.' });
      const data_base64 = await keBase64(file);
      const h = await api('unggahBerkas', { tiket: p.tiket, tahap: nilai.tahap, baris_massal: baris || '', nama_file: nilai.nama_file.trim(), nama_asli: file.name, mime: file.type || '', data_base64 });
      toast(h.selesai ? 'Berkas terunggah · status menjadi Selesai' : 'Berkas terunggah', 'ok');
      halamanDetail([null, p.tiket]);
    }
  });
}

function modalMintaRevisi() {
  bukaModal({
    judul: 'Minta revisi', ket: 'Tiket ini akan kembali ke status Diproses / Revisi, dan riwayatnya tetap tersambung.',

    siap: lap => {
      const tgl = $('#m-tanggal_surat', lap), manual = $('#m-manual', lap), wadah = $('#m-nomor', lap);

        const n = ($('[name=nomor_urut]', lap) || {}).value || '…';

          $('#m-nomor_urut', lap).addEventListener('input', pratinjau); pratinjau(); return;
        }
        wadah.innerHTML = '<div class="rangka" style="height:40px"></div>';
        try {
          const h = await api('daftarBankNomor', { tanggal: tgl.value });

            kosong.length ? '<select class="kontrol" id="m-nomor_urut" name="nomor_urut">' + kosong.map(b => '<option>' + esc(b.nomor) + '</option>').join('') + '</select>'
              : '<select class="kontrol" id="m-nomor_urut" name="nomor_urut" disabled><option value="">Tidak ada nomor kosong</option></select>',

        } catch (e) { wadah.innerHTML = '<p class="ket">' + esc(e.message) + '</p>'; }

  const gambar = q => {

    const tampil = cocok.slice(0, 150);
    const perUnit = [];
    tampil.forEach(r => { let g = perUnit[perUnit.length - 1]; if (!g || g.unit !== r.unit) perUnit.push(g = { unit: r.unit, rows: [] }); g.rows.push(r); });
    $('#hasilPejabat').innerHTML = cocok.length

            '<button class="tbl hantu kecil" onclick="salinPejabat(' + i + ',\'jabatan\')">' + ik('salin') + '<span class="tbl-teks-hp">Jabatan</span></button>' +
            '<button class="tbl kecil" onclick="salinPejabat(' + i + ',\'keduanya\')">' + ik('salin') + '<span class="tbl-teks-hp">Keduanya</span></button></div></div>';
        }).join('')).join('') +

  };
  gambar('');
  $('#cariPejabat').addEventListener('input', e => gambar(e.target.value));
}
function salinPejabat(i, mode) {
  const r = S.pejabat[i];
  const jab = r.jabatan + (/^(kepala|ketua|dekan|direktur|sekretaris|wakil|asisten|supervisor|koordinator)/i.test(r.jabatan) && !/IPB|institut/i.test(r.jabatan) && r.unit !== 'PIMPINAN INSTITUT' ? ' ' + toTitle(r.unit) : '');
  const teks = mode === 'nama' ? r.nama : mode === 'jabatan' ? jab : jab + '\n' + r.nama;
  salinTeks(teks, mode === 'keduanya' ? 'Jabatan dan nama disalin' : (mode === 'nama' ? 'Nama' : 'Jabatan') + ' disalin');
}
const toTitle = s => String(s).toLowerCase().replace(/(^|\s|\()([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Dan|Di|Ke|Untuk)\b/g, w => w.toLowerCase()).replace(/\(([a-z0-9-]+)\)/gi, (m, x) => '(' + x.toUpperCase() + ')');

function modalRekap() {
  bukaModal({
    judul: 'Unduh rekap bulanan', ket: 'Berkas Excel: satu sheet gabungan dan satu sheet per ekosistem.',
    isi: isianModal('bulan', 'Bulan', '<input class="kontrol" type="month" id="m-bulan" name="bulan" value="' + isoBulan(new Date()) + '">'),
    labelOk: 'Unduh',
    aksi: async n => {
      const h = await api('rekapBulanan', { bulan: n.bulan });
      const biner = atob(h.base64), arr = new Uint8Array(biner.length);
      for (let i = 0; i < biner.length; i++) arr[i] = biner.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: /\.csv$/.test(h.nama) ? 'text/csv' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a'); a.href = url; a.download = h.nama; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Rekap ' + h.jumlah + ' pengajuan diunduh', 'ok');
    }
  });
}

  /* ---------------------------------------------------------------- pembantu */
  kini() { const d = new Date(); return isoTanggal(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + '+07:00'; },
  catat(ctx, tiket, aksi, dari, ke, catatan, sumber) { this.data.log.push({ waktu: this.kini(), pelaku: ctx.u.nama, peran: ctx.admin ? 'admin' : 'staf', tiket, aksi, dari: dari || '', ke: ke || '', catatan: catatan || '', sumber: sumber || (ctx.admin ? 'admin' : 'web') }); },
  ubah(ctx, p, ubah, peta, catatan, sumber) {
    Object.keys(ubah).forEach(k => {
      const lama = String(p[k] === undefined || p[k] === null ? '' : p[k] === true ? 'ya' : p[k] === false ? '' : p[k]);
      const baru = String(ubah[k] === undefined || ubah[k] === null ? '' : ubah[k] === true ? 'ya' : ubah[k] === false ? '' : ubah[k]);
      if (lama === baru) return;
      p[k] = ubah[k];
      if (peta[k]) this.catat(ctx, p.tiket, peta[k], lama, baru, typeof catatan === 'function' ? catatan(k) : catatan, sumber);
    });
  },
  ambil(tiket, ctx, bolehDihapus) {
    const p = this.data.pengajuan.find(x => x.tiket === tiket);
    if (!p || (p.dihapus && !(bolehDihapus && ctx.admin))) throw galat('Pengajuan ' + tiket + ' tidak ditemukan.');
    const pemohon = p.atas_nama || p.dibuat_oleh;
    return { p, milik: pemohon === ctx.u.nama || p.dibuat_oleh === ctx.u.nama };
  },
  wajibAdmin(ctx) { if (!ctx.admin) throw galat('Aksi ini khusus admin. Silakan masuk ulang dengan Pass Key.'); },

  detail(tiket, ctx) {
    const db = this.data;
    const p = db.pengajuan.find(x => x.tiket === tiket);
    if (!p || (p.dihapus && !ctx.admin)) throw galat('Pengajuan ' + tiket + ' tidak ditemukan.');
    if (ctx.admin && p.status === 'Baru') {
      this.catat(ctx, tiket, 'dibaca_pertama', '', '', 'Dibuka admin', 'sistem');
      this.ubah(ctx, p, { status: 'Antre' }, { status: 'ubah_status' }, 'Otomatis saat dibuka admin', 'sistem');
      this.simpan();
    }
    const pemohon = p.atas_nama || p.dibuat_oleh;
    const milik = pemohon === ctx.u.nama || p.dibuat_oleh === ctx.u.nama;
    const aktif = ['Baru', 'Antre', 'Diproses'];
    const antrean = aktif.indexOf(p.status) > -1 ? db.pengajuan.filter(x => !x.dihapus && aktif.indexOf(x.status) > -1 && x.dibuat_pada <= p.dibuat_pada).length : 0;
    return JSON.parse(JSON.stringify({
      pengajuan: Object.assign({}, p, { pemohon, antrean }),
      berkas: db.berkas.filter(b => b.tiket === tiket).sort((a, b) => b.diunggah_pada.localeCompare(a.diunggah_pada)),
      komentar: db.komentar.filter(k => k.tiket === tiket).sort((a, b) => a.waktu.localeCompare(b.waktu)),
      log: db.log.filter(l => l.tiket === tiket).sort((a, b) => a.waktu.localeCompare(b.waktu)),
      barisMassal: db.massal.filter(m => m.tiket === tiket).sort((a, b) => Number(a.urutan) - Number(b.urutan)),
      izin: {
        sunting: milik && ['Selesai', 'Dibatalkan'].indexOf(p.status) === -1,
        hapus: !p.dihapus && (ctx.admin || (milik && (p.status === 'Baru' || p.status === 'Antre'))),
        revisi: milik && ['Diproses', 'Selesai'].indexOf(p.status) > -1,
        unggah: milik || ctx.admin, kelola: ctx.admin, pulihkan: ctx.admin && !!p.dihapus
      }
    }));
  },

  /* ---------------------------------------------------------------- router demo */
  panggil(aksi, data, auth) {
    const db = this.muat();
    const u = auth.nama ? db.pengguna.find(x => x.nama === auth.nama && x.aktif) : null;
    const admin = !!(u && u.peran === 'admin' && auth.token === 'demo-token');
    if (aksi === 'init') {
      const r = this.ref();
      if (!admin) r.tautan = r.tautan.filter(t => !t.hanya_admin);
      r.sesi = u ? { nama: u.nama, peran: admin ? 'admin' : 'staf' } : null;
      return r;
    }
    if (aksi === 'masuk') {
      const p = db.pengguna.find(x => x.nama === data.nama && x.aktif);
      if (!p) throw galat('Nama tidak ditemukan atau sudah tidak aktif.');
      if (p.peran !== 'admin') return { nama: p.nama, peran: 'staf', ekosistem: p.ekosistem, jabatan: p.jabatan };
      if (data.passkey !== 'demo') throw galat('Pass Key tidak sesuai.', { passkey: 'Pass Key tidak sesuai. Di mode demo, Pass Key-nya: demo' });
      return { nama: p.nama, peran: 'admin', ekosistem: p.ekosistem, jabatan: p.jabatan, token: 'demo-token' };
    }
    if (aksi === 'keluar') return { keluar: true };
    if (!u) throw galat('Sesi tidak dikenali. Silakan masuk ulang.');
    const ctx = { u, admin };
    const fn = this.aksi[aksi];
    if (!fn) throw galat('Aksi "' + aksi + '" tidak tersedia di mode demo.');
    const hasil = fn.call(this, data, ctx, db);
    this.simpan();
    return hasil;
  },

  aksi: {
    daftarPengajuan(data, ctx, db) { return this.daftar(db, data, ctx.u, ctx.admin); },
    detailPengajuan(data, ctx) { return this.detail(data.tiket, ctx); },
    buatPengajuan(data, ctx, db) { return this.buat(data, ctx, db, false); },
    catatPengajuan(data, ctx, db) { this.wajibAdmin(ctx); return this.buat(data, ctx, db, true); },
    unggahBerkas(data, ctx, db) {
      const { p, milik } = this.ambil(data.tiket, ctx);
      if (!milik && !ctx.admin) throw galat('Hanya pemohon atau admin yang dapat mengunggah berkas ke pengajuan ini.');
      const bm = data.baris_massal ? String(data.baris_massal) : '';
      const versi = db.berkas.filter(b => b.tiket === p.tiket && b.tahap === data.tahap && String(b.baris_massal || '') === bm).length + 1;
      const ext = (String(data.nama_asli).match(/\.[A-Za-z0-9]{1,6}$/) || [''])[0];
      const nama = data.nama_file + (ext && !data.nama_file.toLowerCase().endsWith(ext.toLowerCase()) ? ext : '');
      const berkas = { id: 'B' + Math.random().toString(36).slice(2, 10), tiket: p.tiket, baris_massal: bm, drive_id: 'demo', nama_file: nama, nama_asli: data.nama_asli, tahap: data.tahap, versi: String(versi),
        ukuran: String(Math.round((data.data_base64 || '').length * 0.75)), mime: data.mime, diunggah_oleh: ctx.u.nama, diunggah_pada: this.kini() };
      db.berkas.push(berkas);
      p.folder_id = p.folder_id || 'demo';
      this.catat(ctx, p.tiket, 'unggah_berkas', '', data.tahap + ' v' + versi, nama + (nama !== data.nama_asli ? ' (asli: ' + data.nama_asli + ')' : ''));
      let selesai = false;
      if (ctx.admin && (data.tahap === 'Final' || data.tahap === 'E-meterai')) {
        if (bm) {
          const r = db.massal.find(m => m.tiket === p.tiket && m.urutan === bm);
          if (r) { r.status_baris = 'Selesai'; r.berkas_hasil_id = berkas.id; }
          const semua = db.massal.filter(m => m.tiket === p.tiket);
          selesai = semua.length > 0 && semua.every(m => m.status_baris === 'Selesai');
        } else selesai = true;
        if (selesai && p.status !== 'Selesai') this.ubah(ctx, p, { status: 'Selesai', substatus: '', selesai_pada: this.kini() }, { status: 'ubah_status', substatus: 'ubah_substatus' }, 'Otomatis: berkas ' + data.tahap + ' diunggah', 'sistem');
      }
      return { berkas, selesai };
    },
    ubahStatus(data, ctx) {
      this.wajibAdmin(ctx);
      if (data.status === 'Diproses' && !data.substatus) throw galat('Pilih tahap proses.', { substatus: 'Pilih tahap proses.' });
      const { p } = this.ambil(data.tiket, ctx);
      const ubah = { status: data.status, substatus: data.status === 'Diproses' ? data.substatus : '', catatan_admin: String(data.catatan_admin || '').trim() };
      if (data.status === 'Selesai' && !p.selesai_pada) ubah.selesai_pada = this.kini();
      if (data.status !== 'Selesai') ubah.selesai_pada = '';
      this.ubah(ctx, p, ubah, { status: 'ubah_status', substatus: 'ubah_substatus', catatan_admin: 'ubah_catatan_admin' }, '', 'admin');
      return this.detail(p.tiket, ctx);
    },
    ubahPrioritas(data, ctx) {

  buat(data, ctx, db, catat) {
    const awalan = (data.jenis === 'Surat' ? 'SRT' : 'DSN') + '-' + isoTanggal(new Date()).slice(2).replace(/-/g, '') + '-';
    const maks = db.pengajuan.filter(p => p.tiket.indexOf(awalan) === 0).reduce((m, p) => Math.max(m, Number(p.tiket.slice(awalan.length)) || 0), 0);
    const tiket = awalan + pad2(maks + 1);
    const pt = this.ref().penandatangan.find(x => x.jabatan === data.penandatangan);
    const p = Object.assign({ nomor_urut: '', kode_surat: '', estimasi_selesai: '', catatan_admin: '', dientri_eoffice: false }, data, {
      tiket, dibuat_pada: this.kini(), dibuat_oleh: ctx.u.nama, atas_nama: catat ? data.atas_nama : '', sumber: catat ? data.sumber : 'COPM',
      status: 'Baru', substatus: '', nomor_surat: data.nomor_surat || '', selesai_pada: '', folder_id: '', dihapus: false, massal: !!data.massal,
      rantai_paraf: pt ? pt.rantai_paraf : '', batas_keperluan: data.prioritas === 'Biasa' ? '' : data.batas_keperluan, bulan_keperluan: data.prioritas === 'Biasa' ? data.bulan_keperluan : ''
    });
    delete p.baris_massal;
    db.pengajuan.push(p);
    (data.baris_massal || []).forEach((m, i) => db.massal.push({ tiket, urutan: String(i + 1), nama_berkas_asal: m.nama_berkas_asal, tujuan: m.tujuan, nomor_surat: '', status_baris: 'Menunggu', berkas_hasil_id: '' }));
    this.catat(ctx, tiket, 'buat_pengajuan', '', 'Baru', catat ? 'Dicatat oleh ' + ctx.u.nama + ' atas nama ' + data.atas_nama + ', sumber: ' + data.sumber : '');
    if (data.pernyataan_dibaca) this.catat(ctx, tiket, 'pernyataan_dibaca', '', 'ya', ctx.u.nama + ' menyatakan sudah membaca dan bertanggung jawab atas isi surat');
    return { tiket };
  },

  daftar(db, data, u, admin) {
    const f = data.filter || {};
    const eko = {}; db.pengguna.forEach(p => { eko[p.nama] = p.ekosistem; });
    const bulanIni = isoBulan(new Date());
    const aktifS = s => (s === 'Selesai' || s === 'Dibatalkan') ? 0 : 1;
    const terbaru = (tiket, tahap) => db.berkas.filter(b => b.tiket === tiket && tahap.indexOf(b.tahap) > -1).sort((a, b) => b.diunggah_pada.localeCompare(a.diunggah_pada))[0];
    let baris = db.pengajuan.filter(p => !p.dihapus).map(p => {
      const pemohon = p.atas_nama || p.dibuat_oleh;
      const milik = pemohon === u.nama || p.dibuat_oleh === u.nama;
      const raw = terbaru(p.tiket, ['Draft', 'Siap TTD']), signed = terbaru(p.tiket, ['Final', 'E-meterai']);
      return Object.assign({}, p, { pemohon, ekosistem: eko[pemohon] || '', berkas_raw: raw ? raw.id : '', berkas_signed: signed ? signed.id : '',
        bisa_hapus: admin || (milik && (p.status === 'Baru' || p.status === 'Antre')) });
    });
    if (f.milik) baris = baris.filter(b => b.pemohon === u.nama || b.dibuat_oleh === u.nama);
    const ringkasan = { Baru: 0, Antre: 0, Diproses: 0, Mendesak: 0, Selesai_bulan_ini: 0, total: baris.length };
    baris.forEach(b => {
      if (ringkasan[b.status] !== undefined) ringkasan[b.status]++;
      if (b.prioritas === 'Mendesak' && aktifS(b.status)) ringkasan.Mendesak++;
      if (b.status === 'Selesai' && String(b.selesai_pada).slice(0, 7) === bulanIni) ringkasan.Selesai_bulan_ini++;
    });
    ['jenis', 'status', 'prioritas', 'ekosistem'].forEach(k => { if (f[k]) baris = baris.filter(b => b[k] === f[k]); });
    if (f.bulan) baris = baris.filter(b => String(b.dibuat_pada).slice(0, 7) === f.bulan);
    if (f.kartu === 'mendesak') baris = baris.filter(b => b.prioritas === 'Mendesak' && aktifS(b.status));
    if (f.kartu === 'selesai_bulan_ini') baris = baris.filter(b => b.status === 'Selesai' && String(b.selesai_pada).slice(0, 7) === bulanIni);
    if (f.q) { const q = f.q.toLowerCase(); baris = baris.filter(b => [b.tiket, b.perihal, b.nomor_surat, b.pemohon, b.tujuan].join(' ').toLowerCase().includes(q)); }
    const bobotP = { Mendesak: 0, Terjadwal: 1, Biasa: 2 }, bobotS = { Baru: 0, Antre: 1, Diproses: 2, Selesai: 3, Dibatalkan: 4 };
    const akhirBulan = ym => { const [y, m] = ym.split('-').map(Number); return ym + '-' + pad2(new Date(y, m, 0).getDate()); };
    const tenggat = b => b.prioritas === 'Biasa' ? akhirBulan(b.bulan_keperluan || bulanIni) : (b.batas_keperluan || '9999-12-31');
    const masukDesc = (a, b) => String(b.dibuat_pada).localeCompare(String(a.dibuat_pada));
    const cmp = {
      masuk: masukDesc,
      batas: (a, b) => (aktifS(b.status) - aktifS(a.status)) || tenggat(a).localeCompare(tenggat(b)) || masukDesc(a, b),
      prioritas: (a, b) => (aktifS(b.status) - aktifS(a.status)) || (bobotP[a.prioritas] - bobotP[b.prioritas]) || tenggat(a).localeCompare(tenggat(b)),
      status: (a, b) => (bobotS[a.status] - bobotS[b.status]) || masukDesc(a, b)
    }[data.urut] || masukDesc;
    baris.sort(cmp);
    const halaman = data.halaman || 1, ukuran = 50;
    const hasil = { baris: JSON.parse(JSON.stringify(baris.slice((halaman - 1) * ukuran, halaman * ukuran))), total: baris.length, halaman, ukuran, ringkasan };
    if (admin) {
      const kini = isoTanggal(hariIni());
      const n = db.bank.filter(x => x.tanggal_terima === kini);
      hasil.nomorHariIni = { tanggal: kini, total: n.length, sisa: n.filter(x => !x.tiket).length };
    }
    return hasil;
  }
};

jalankanRute();
