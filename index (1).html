<style>
/* ================================================================ TOKEN */
:root {
  --biru: #1A3D8F; --biru-tekan: #152F6E; --biru-muda: #EAF0FB;
  --kuning: #F2B705; --hijau: #0F7B50; --merah: #B42318;
  --teks: #0F1724; --teks-redup: #5A6476; --garis: #E3E7EE;
  --dasar: #F6F8FB; --kartu: #FFFFFF;
  --teks-di-biru: var(--kartu);
  color-scheme: light;
}
[data-tema="gelap"] {
  --biru: #5B8DEF; --biru-tekan: #7BA4F2; --biru-muda: #16233D;
  --kuning: #F6C544; --hijau: #43B47F; --merah: #F28B82;
  --teks: #E6EAF2; --teks-redup: #9AA4B8; --garis: #273348;
  --dasar: #0D131F; --kartu: #161E2C;
  --teks-di-biru: var(--dasar);
  color-scheme: dark;
}
:root, [data-tema] {
  /* Turunan dari token, bukan warna baru */
  --kuning-lembut: color-mix(in srgb, var(--kuning) 18%, var(--kartu));
  --merah-lembut: color-mix(in srgb, var(--merah) 11%, var(--kartu));
  --hijau-lembut: color-mix(in srgb, var(--hijau) 12%, var(--kartu));
  --abu-lembut: color-mix(in srgb, var(--teks-redup) 11%, var(--kartu));
  --biru-lembut: color-mix(in srgb, var(--biru) 10%, var(--kartu));
  --garis-kuat: color-mix(in srgb, var(--teks-redup) 35%, var(--garis));
  --bayang-1: 0 1px 2px color-mix(in srgb, var(--teks) 6%, transparent);
  --bayang-2: 0 8px 24px color-mix(in srgb, var(--teks) 12%, transparent), 0 2px 6px color-mix(in srgb, var(--teks) 6%, transparent);
  --cincin: 0 0 0 3px color-mix(in srgb, var(--biru) 28%, transparent);

  --f-judul: 28px; --f-bagian: 18px; --f-teks: 14px; --f-ket: 12px;
  --r-kartu: 12px; --r-kontrol: 8px; --r-pill: 999px;
  --font: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-miring: "Inter", system-ui, sans-serif;
}

/* ================================================================ DASAR */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: var(--f-teks); line-height: 1.5;
  color: var(--teks); background: var(--dasar);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
em, i { font-family: var(--font-miring); font-style: italic; }
a { color: var(--biru); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: var(--f-judul); line-height: 1.25; letter-spacing: -0.02em; }
h2 { font-size: var(--f-bagian); line-height: 1.35; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--cincin); }
.redup { color: var(--teks-redup); }
.ket { font-size: var(--f-ket); color: var(--teks-redup); }
.tebal { font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ikon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ikon.b { width: 20px; height: 20px; }

/* ================================================================ KONTROL */
.tbl {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: var(--r-kontrol);
  font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer;
  border: 1px solid var(--garis-kuat); background: var(--kartu); color: var(--teks);
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.tbl:hover { background: var(--biru-lembut); border-color: var(--biru); color: var(--biru); text-decoration: none; }
.tbl.utama { background: var(--biru); border-color: var(--biru); color: var(--teks-di-biru); }
.tbl.utama:hover { background: var(--biru-tekan); border-color: var(--biru-tekan); color: var(--teks-di-biru); }
.tbl.hantu { border-color: transparent; background: transparent; color: var(--teks-redup); }
.tbl.hantu:hover { background: var(--abu-lembut); color: var(--teks); border-color: transparent; }
.tbl.kecil { height: 32px; padding: 0 12px; font-size: 13px; }
.tbl.ikon-saja { width: 40px; padding: 0; }
.tbl.kecil.ikon-saja { width: 32px; }
.tbl.penuh { width: 100%; }
.tbl[disabled] { opacity: .5; pointer-events: none; }
.tbl .putar { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: putar .7s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }

.isian { display: grid; gap: 6px; }
.isian > label, .label { font-weight: 600; font-size: 14px; }
.kontrol {
  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-kontrol);
  border: 1px solid var(--garis-kuat); background: var(--kartu); color: var(--teks);
  transition: border-color .15s, box-shadow .15s;
}
.kontrol::placeholder { color: var(--teks-redup); }
.kontrol:hover { border-color: var(--teks-redup); }
.kontrol:focus { outline: none; border-color: var(--biru); box-shadow: var(--cincin); }
.isian.salah .kontrol { border-color: var(--merah); }
.pesan-salah { display: none; font-size: var(--f-ket); color: var(--merah); }
.isian.salah .pesan-salah { display: block; }
select.kontrol { appearance: none; padding-right: 36px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--teks-redup) 50%), linear-gradient(135deg, var(--teks-redup) 50%, transparent 50%);
  background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.centang { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; user-select: none; }
.centang input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--biru); cursor: pointer; }
.dengan-ikon { position: relative; }
.dengan-ikon > .ikon { position: absolute; left: 12px; top: 12px; color: var(--teks-redup); pointer-events: none; }
.dengan-ikon > .kontrol { padding-left: 36px; }
.dengan-ikon > .tbl-mata { position: absolute; right: 4px; top: 4px; }

/* ================================================================ LENCANA */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill .titik { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-Baru { background: var(--kuning-lembut); color: var(--teks); }
.s-Baru .titik { background: var(--kuning); }
.s-Antre { background: var(--biru-muda); color: var(--biru); }
.s-Antre .titik { background: transparent; box-shadow: inset 0 0 0 1.5px var(--biru); }
.s-Diproses { background: var(--biru); color: var(--teks-di-biru); }
.s-Selesai { background: var(--hijau-lembut); color: var(--hijau); }
.s-Dibatalkan { background: var(--abu-lembut); color: var(--teks-redup); }
.p-Mendesak { background: var(--merah-lembut); color: var(--merah); }
.p-Terjadwal { background: var(--biru-muda); color: var(--biru); }
.p-Biasa { background: var(--abu-lembut); color: var(--teks-redup); }
.lencana { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700;
  letter-spacing: .02em; background: var(--abu-lembut); color: var(--teks-redup); vertical-align: 1px; }
.lencana.sumber { background: var(--kuning-lembut); color: var(--teks); }
.hitung { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill);
  background: var(--kuning); color: var(--teks); font-size: 11px; font-weight: 700; }
[data-tema="gelap"] .hitung { color: var(--dasar); }

/* ================================================================ DEMO */
.pita-demo { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  padding: 6px 16px; background: var(--biru-muda); color: var(--biru); font-size: var(--f-ket); font-weight: 500; }
.pita-demo button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600; padding: 0; font-size: inherit; }

/* ================================================================ MASUK */
.masuk { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(420px, 1fr); }
.sampul { position: relative; overflow: hidden; background: var(--biru-tekan); }
.slide { position: absolute; inset: 0; opacity: 0; background-size: cover; background-position: center; animation: pudar var(--durasi) infinite; }
.slide.tunggal { opacity: 1; animation: none; }
.slide.gradasi { background:
  radial-gradient(1200px 600px at 15% 110%, color-mix(in srgb, var(--kuning) 26%, transparent), transparent 60%),
  radial-gradient(900px 500px at 110% -10%, color-mix(in srgb, var(--biru-muda) 22%, transparent), transparent 60%),
  linear-gradient(150deg, var(--biru) 0%, var(--biru-tekan) 100%); }
[data-tema="gelap"] .slide.gradasi { background:
  radial-gradient(1200px 600px at 15% 110%, color-mix(in srgb, var(--kuning) 16%, transparent), transparent 60%),
  linear-gradient(150deg, var(--biru-muda) 0%, var(--dasar) 100%); }
/* keyframes 'pudar' dibuat di JS sesuai jumlah foto */
.sampul::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, color-mix(in srgb, var(--biru-tekan) 70%, transparent)); pointer-events: none; }
[data-tema="gelap"] .sampul::after { background: linear-gradient(180deg, transparent 45%, color-mix(in srgb, var(--dasar) 80%, transparent)); }
.sampul-teks { position: absolute; left: 48px; right: 48px; bottom: 48px; z-index: 2; color: var(--kartu); }
[data-tema="gelap"] .sampul-teks { color: var(--teks); }
.sampul-teks .besar { font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; max-width: 520px; }
.sampul-teks .kecil { margin-top: 12px; opacity: .85; max-width: 460px; }
.sampul-pola { position: absolute; inset: 0; z-index: 1; opacity: .5; pointer-events: none;
  background-image: radial-gradient(color-mix(in srgb, var(--biru-muda) 22%, transparent) 1px, transparent 1px); background-size: 24px 24px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%); }
.panel-masuk { display: flex; flex-direction: column; background: var(--kartu); }
.panel-masuk .atas { display: flex; justify-content: flex-end; padding: 16px 24px 0; }
.form-masuk { width: 100%; max-width: 400px; margin: auto; padding: 32px 24px 48px; display: grid; gap: 24px; }
.merek { display: flex; align-items: center; gap: 12px; }
.monogram { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: var(--biru); color: var(--teks-di-biru); font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.monogram.kecil { width: 32px; height: 32px; border-radius: 8px; font-size: 11px; }
.merek img { height: 40px; width: auto; }
.merek .nama-unit { font-size: var(--f-ket); color: var(--teks-redup); line-height: 1.35; }
.salam { color: var(--teks-redup); margin-bottom: 4px; }
.form-masuk h1 { font-size: 32px; }
.form-masuk h1 span { color: var(--biru); }
.sub-masuk { color: var(--teks-redup); margin-top: 8px; }
.kaki-masuk { font-size: var(--f-ket); color: var(--teks-redup); text-align: center; }
.petunjuk-demo { padding: 10px 12px; border-radius: var(--r-kontrol); background: var(--biru-muda); color: var(--biru); font-size: var(--f-ket); }
.muncul { animation: muncul .2s ease-out; }
@keyframes muncul { from { opacity: 0; transform: translateY(-4px); } }

/* Combobox nama */
.kombo { position: relative; }
.kombo-daftar { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; max-height: 300px; overflow: auto;
  background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-2); padding: 4px; display: none; }
.kombo.buka .kombo-daftar { display: block; }
.opsi { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-kontrol); cursor: pointer; }
.opsi[aria-selected="true"], .opsi:hover { background: var(--biru-muda); }
.opsi .nm { font-weight: 500; }
.opsi .ket { line-height: 1.3; }
.opsi-kosong { padding: 12px; color: var(--teks-redup); text-align: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--biru-muda); color: var(--biru); font-size: 12px; font-weight: 700; }
.avatar.admin { background: var(--biru); color: var(--teks-di-biru); }

/* ================================================================ KERANGKA */
.kerangka { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.sisi { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px; padding: 20px 12px;
  background: var(--kartu); border-right: 1px solid var(--garis); }
.sisi .merek { padding: 0 8px; }
.sisi .merek .nm { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; line-height: 1.2; }
.navigasi { display: grid; gap: 2px; }
.navigasi .judul-grup { padding: 16px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--teks-redup); }
.nav { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--r-kontrol);
  color: var(--teks-redup); font-weight: 500; }
.nav:hover { background: var(--abu-lembut); color: var(--teks); text-decoration: none; }
.nav.aktif { background: var(--biru-muda); color: var(--biru); font-weight: 600; }
.nav .hitung { margin-left: auto; }
.sisi .bawah { margin-top: auto; padding: 0 8px; font-size: 11px; color: var(--teks-redup); }
.utama-isi { min-width: 0; display: flex; flex-direction: column; }
.kepala { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 32px;
  background: color-mix(in srgb, var(--dasar) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--garis); }
.kepala .merek-hp { display: none; }
.kepala .kanan { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pengguna-chip { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: var(--r-pill); border: 1px solid var(--garis); background: var(--kartu); }
.pengguna-chip .nm { font-weight: 600; line-height: 1.2; font-size: 13px; }
.pengguna-chip .ket { line-height: 1.2; font-size: 11px; }
.nav-hp { display: none; }
.konten > * { min-width: 0; }
.konten { padding: 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-content: start; max-width: 1440px; width: 100%; }

/* ================================================================ HALAMAN */
.judul-halaman { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.judul-halaman .teks { display: grid; gap: 4px; }
.judul-halaman .aksi { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-1); }
.kartu-isi { padding: 20px; }

.angka-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.angka { text-align: left; cursor: pointer; padding: 16px 16px 14px; display: grid; gap: 4px; position: relative;
  background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-1); transition: border-color .15s, box-shadow .15s; }
.angka:hover { border-color: var(--garis-kuat); }
.angka.aktif { border-color: var(--biru); box-shadow: 0 0 0 1px var(--biru); }
.angka .lbl { display: flex; align-items: center; gap: 8px; color: var(--teks-redup); font-weight: 500; }
.angka .lbl .titik { width: 8px; height: 8px; border-radius: 50%; }
.angka .nilai { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.angka.sorot { background: linear-gradient(180deg, var(--kuning-lembut), var(--kartu) 80%); }

.alat-admin { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); gap: 16px; }
.nomor-kartu { display: grid; gap: 12px; }
.nomor-kartu .baris { display: flex; align-items: baseline; gap: 8px; }
.nomor-kartu .besar { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.meteran { height: 6px; border-radius: 3px; background: var(--abu-lembut); overflow: hidden; }
.meteran > span { display: block; height: 100%; background: var(--biru); border-radius: 3px; }
.peringatan { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-kontrol);
  background: var(--kuning-lembut); color: var(--teks); font-size: 13px; }
.peringatan .ikon { color: var(--kuning); margin-top: 2px; }
[data-tema="gelap"] .peringatan .ikon { color: var(--kuning); }
.tautan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tautan { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--r-kontrol);
  border: 1px solid var(--garis); color: var(--teks); font-weight: 500; font-size: 13px; min-width: 0; }
.tautan span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tautan .ikon { color: var(--biru); }
.tautan:hover { border-color: var(--biru); background: var(--biru-lembut); text-decoration: none; }
.tautan .panah { margin-left: auto; color: var(--teks-redup); width: 14px; height: 14px; }
.kepala-kartu { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.kepala-kartu h2 { font-size: 15px; }

/* Tab */
.tab-baris { display: flex; gap: 4px; border-bottom: 1px solid var(--garis); padding: 0 20px; }
.tab { position: relative; height: 48px; padding: 0 12px; border: 0; background: none; cursor: pointer; color: var(--teks-redup); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--teks); }
.tab.aktif { color: var(--biru); }
.tab.aktif::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--biru); }
.tab .jml { font-size: 12px; color: var(--teks-redup); font-weight: 500; }

/* Bilah filter */
.bilah { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 20px; }
.bilah .cari { flex: 1 1 240px; max-width: 340px; }
.bilah .kanan { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.bilah .kanan .kontrol { width: auto; height: 32px; font-size: 13px; }
.bilah .cari .kontrol { height: 32px; font-size: 13px; }
.bilah .cari > .ikon { top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill);
  border: 1px dashed var(--garis-kuat); background: var(--kartu); color: var(--teks-redup); font-size: 13px; font-weight: 500; cursor: pointer; }
.chip:hover { border-color: var(--teks-redup); color: var(--teks); }
.chip.aktif { border-style: solid; border-color: var(--biru); background: var(--biru-muda); color: var(--biru); font-weight: 600; }
.chip .x { display: grid; place-items: center; width: 18px; height: 18px; margin-right: -6px; border-radius: 50%; }
.chip .x:hover { background: color-mix(in srgb, var(--biru) 15%, transparent); }
.chip .ikon { width: 14px; height: 14px; }
.tautan-hapus { border: 0; background: none; color: var(--biru); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0 4px; }

/* Tabel */
.gulir { overflow-x: auto; position: relative; } /* relative: label .sr di dalam tabel tidak bocor ke lebar halaman */
table.data { width: 100%; border-collapse: collapse; min-width: 960px; }
.data th { text-align: left; font-size: 12px; font-weight: 600; color: var(--teks-redup); padding: 10px 12px; border-top: 1px solid var(--garis); border-bottom: 1px solid var(--garis); background: color-mix(in srgb, var(--dasar) 60%, var(--kartu)); white-space: nowrap; }
.data th:first-child, .data td:first-child { padding-left: 20px; }
.data th:last-child, .data td:last-child { padding-right: 20px; }
.data td { padding: 12px; border-bottom: 1px solid var(--garis); vertical-align: top; }
.data tbody tr { cursor: pointer; transition: background .1s; }
.data tbody tr:hover { background: var(--biru-lembut); }
.data tbody tr:last-child td { border-bottom: 0; }
.data tr.baru td:first-child { box-shadow: inset 3px 0 0 var(--kuning); }
.sel-perihal { display: grid; gap: 2px; max-width: 380px; }
.sel-perihal .perihal { font-weight: 600; line-height: 1.35; }
.sel-perihal .meta { font-size: 12px; color: var(--teks-redup); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.sel-perihal .meta .sep::before { content: "·"; }
.mono { font-variant-numeric: tabular-nums; }
.sel-dua { display: grid; gap: 2px; white-space: nowrap; }
.sel-dua .k { font-size: 12px; color: var(--teks-redup); }
.jenis { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.jenis .ikon { color: var(--teks-redup); }
.w-lewat .a { color: var(--merah); font-weight: 600; }
.w-lewat .k { color: var(--merah); }
.w-dekat .k { color: var(--teks); font-weight: 600; }
.w-dekat .k::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--kuning); margin-right: 6px; vertical-align: 1px; }
.w-biasa .a { color: var(--teks-redup); }
.sel-status { display: grid; gap: 4px; justify-items: start; }
.sel-status .sub { font-size: 12px; color: var(--teks-redup); white-space: nowrap; }
.sel-aksi { display: flex; gap: 4px; justify-content: flex-end; }
.kosong { padding: 56px 20px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--teks-redup); }
.kosong .ikon { width: 32px; height: 32px; stroke-width: 1.4; }
.kosong .judul { color: var(--teks); font-weight: 600; font-size: 15px; }
.kaki-tabel { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--garis); }
.rangka { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--abu-lembut), var(--garis), var(--abu-lembut)); background-size: 200% 100%; animation: kilau 1.2s infinite; }
@keyframes kilau { to { background-position: -200% 0; } }

/* Menu & popover */
.menu { position: fixed; z-index: 60; min-width: 220px; padding: 4px; background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-2); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-kontrol); background: none; cursor: pointer; text-align: left; font-size: 13px; }
.menu button:hover:not([disabled]) { background: var(--biru-muda); }
.menu button[disabled] { opacity: .4; cursor: default; }
.menu button .ikon { color: var(--teks-redup); }
.menu button.bahaya { color: var(--merah); }
.menu button.bahaya .ikon { color: var(--merah); }
.menu hr { border: 0; border-top: 1px solid var(--garis); margin: 4px 0; }
.menu button.terpilih { color: var(--biru); font-weight: 600; }
.menu button .cek { margin-left: auto; color: var(--biru); }

/* Toast */
.wadah-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: var(--r-kontrol);
  background: var(--teks); color: var(--kartu); box-shadow: var(--bayang-2); font-size: 13px; font-weight: 500; animation: muncul .2s ease-out; }
.toast.salah { background: var(--merah); color: var(--kartu); }
[data-tema="gelap"] .toast.salah { color: var(--dasar); }

/* Placeholder halaman yang belum dibangun */
.segera { padding: 48px 24px; display: grid; justify-items: center; text-align: center; gap: 12px; }
.segera .ikon { width: 40px; height: 40px; color: var(--biru); stroke-width: 1.4; }
.segera p { max-width: 460px; color: var(--teks-redup); }

/* Pilih jenis pengajuan */
.pilih-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.pilih { text-align: left; cursor: pointer; padding: 20px; display: grid; gap: 8px; align-content: start; min-height: 160px;
  background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-1); transition: border-color .15s, transform .15s, box-shadow .15s; }
.pilih:hover { border-color: var(--biru); box-shadow: var(--bayang-2); transform: translateY(-1px); text-decoration: none; }
.pilih .lingkar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--biru-muda); color: var(--biru); margin-bottom: 4px; }
.pilih .jdl { font-weight: 600; font-size: 15px; color: var(--teks); }
.pilih .ket { font-size: 13px; line-height: 1.45; }
.subjudul { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--teks-redup); }

/* ================================================================ RESPONSIF */
@media (max-width: 1100px) {
  .angka-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .alat-admin { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .masuk { grid-template-columns: 1fr; }
  .sampul { height: 200px; }
  .sampul-teks { left: 24px; right: 24px; bottom: 20px; }
  .sampul-teks .besar { font-size: 22px; }
  .sampul-teks .kecil { display: none; }
  .form-masuk { margin: 0 auto; padding-top: 8px; }
  .kerangka { grid-template-columns: minmax(0, 1fr); }
  .sisi { display: none; }
  .kepala { padding: 0 16px; height: 56px; }
  .kepala .merek-hp { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .kepala .judul-kepala { display: none; }
  .pengguna-chip .teks-chip { display: none; }
  .pengguna-chip { padding: 2px; }
  .nav-hp { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; background: var(--kartu); border-bottom: 1px solid var(--garis); position: sticky; top: 56px; z-index: 19; scrollbar-width: none; }
  .nav-hp::-webkit-scrollbar { display: none; }
  .nav-hp .nav { height: 36px; flex: none; }
  .konten { padding: 20px 16px 32px; gap: 16px; }
  .judul-halaman .aksi { margin-left: 0; width: 100%; }
  .judul-halaman .aksi .tbl { flex: 1; }
  .bilah { padding: 12px 16px; }
  .bilah .cari { max-width: none; flex-basis: 100%; }
  .bilah .kanan { margin-left: 0; }
  .tab-baris { padding: 0 8px; }
  .data th:first-child, .data td:first-child { padding-left: 16px; }
}
@media (max-width: 560px) {
  .angka-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .angka .nilai { font-size: 24px; }
  .angka { padding: 12px; }
  h1 { font-size: 24px; }
  .tbl-teks-hp { display: none; }
  .pita-demo > .ikon { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ================================================================ SIDEBAR BIRU */
:root, [data-tema] {
  --sisi-latar: var(--biru);
  --sisi-teks: var(--kartu);
  --sisi-redup: color-mix(in srgb, var(--kartu) 72%, var(--biru));
  --sisi-hover: color-mix(in srgb, var(--kartu) 10%, transparent);
  --sisi-aktif: color-mix(in srgb, var(--kartu) 18%, transparent);
  --sisi-garis: color-mix(in srgb, var(--kartu) 14%, transparent);
}
[data-tema="gelap"] {
  --sisi-latar: var(--biru-muda);
  --sisi-teks: var(--teks);
  --sisi-redup: var(--teks-redup);
  --sisi-hover: color-mix(in srgb, var(--teks) 7%, transparent);
  --sisi-aktif: color-mix(in srgb, var(--biru) 24%, transparent);
  --sisi-garis: var(--garis);
}
.sisi { background: var(--sisi-latar); border-right-color: var(--sisi-garis); color: var(--sisi-teks); transition: width .2s; }
.sisi .ket { color: var(--sisi-redup); }
.sisi .monogram { background: var(--sisi-teks); color: var(--sisi-latar); }
.sisi .nav { color: var(--sisi-redup); position: relative; }
.sisi .nav:hover { background: var(--sisi-hover); color: var(--sisi-teks); }
.sisi .nav.aktif { background: var(--sisi-aktif); color: var(--sisi-teks); }
.sisi .nav.aktif::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--sisi-teks); }
.sisi .judul-grup { color: var(--sisi-redup); }
.sisi .bawah { color: var(--sisi-redup); }
.sisi .kepala-sisi { display: flex; align-items: center; gap: 8px; }
.sisi .kepala-sisi .merek { flex: 1; min-width: 0; }
.tbl-lipat { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: var(--r-kontrol); background: none; color: var(--sisi-redup); cursor: pointer; flex: none; }
.tbl-lipat:hover { background: var(--sisi-hover); color: var(--sisi-teks); }
.tbl-lipat .ikon { transition: transform .2s; }

.kerangka { transition: grid-template-columns .2s; }
.kerangka.lipat { grid-template-columns: 72px minmax(0, 1fr); }
.kerangka.lipat .sisi { padding-left: 12px; padding-right: 12px; }
.kerangka.lipat .sisi .kepala-sisi { flex-direction: column; }
.kerangka.lipat .sisi .merek > div:not(.monogram),
.kerangka.lipat .sisi .nav span:not(.hitung),
.kerangka.lipat .sisi .judul-grup,
.kerangka.lipat .sisi .bawah { display: none; }
.kerangka.lipat .sisi .judul-grup + * { margin-top: 12px; }
.kerangka.lipat .sisi .nav { justify-content: center; padding: 0; }
.kerangka.lipat .sisi .nav .hitung { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; font-size: 10px; padding: 0 4px; }
.kerangka.lipat .tbl-lipat .ikon { transform: scaleX(-1); }
.kerangka.lipat .sisi .merek { padding: 0; justify-content: center; }

/* ================================================================ FORM */
.form-tata { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.form-kiri { display: grid; gap: 16px; min-width: 0; }
.form-kanan { position: sticky; top: 88px; display: grid; gap: 16px; }
.bagian { padding: 24px; display: grid; gap: 20px; }
.bagian-kepala { display: flex; gap: 12px; align-items: flex-start; }
.bagian-kepala .no { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px;
  background: var(--biru-muda); color: var(--biru); font-size: 12px; font-weight: 700; }
.bagian-kepala h2 { font-size: 16px; }
.bagian-kepala p { font-size: 13px; color: var(--teks-redup); margin-top: 2px; }
.bagian-isi { display: grid; gap: 16px; }
.baris-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.baris-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.isian > label .opsional, .label .opsional { font-weight: 400; color: var(--teks-redup); font-size: 12px; margin-left: 4px; }
.bantuan { font-size: var(--f-ket); color: var(--teks-redup); }
textarea.kontrol { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
input[type="date"].kontrol, input[type="time"].kontrol, input[type="month"].kontrol { padding-right: 8px; }
.isian.salah .chip-grup, .isian.salah .segmen, .isian.salah .zona { outline: 1px solid var(--merah); outline-offset: 4px; border-radius: var(--r-kontrol); }
.isian.salah.centang-wajib .centang { color: var(--merah); }

.segmen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.segmen label { position: relative; display: grid; gap: 2px; padding: 12px 14px 12px 40px; border: 1px solid var(--garis-kuat); border-radius: var(--r-kontrol); cursor: pointer; background: var(--kartu); transition: border-color .15s, background .15s; }
.segmen label:hover { border-color: var(--teks-redup); }
.segmen input { position: absolute; left: 14px; top: 14px; width: 16px; height: 16px; margin: 0; accent-color: var(--biru); }
.segmen label:has(input:checked) { border-color: var(--biru); background: var(--biru-muda); box-shadow: 0 0 0 1px var(--biru); }
.segmen .jdl { font-weight: 600; }
.segmen .ket { line-height: 1.4; }
.segmen.ringkas label { padding: 8px 12px 8px 36px; }
.segmen.ringkas input { top: 10px; left: 12px; }

.chip-grup { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-kelompok { display: grid; gap: 6px; }
.chip-kelompok .kel { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--teks-redup); }
.cp { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: var(--r-pill); border: 1px solid var(--garis-kuat);
  background: var(--kartu); cursor: pointer; font-size: 13px; font-weight: 500; user-select: none; }
.cp:hover { border-color: var(--teks-redup); }
.cp input { position: absolute; opacity: 0; pointer-events: none; }
.cp:has(input:checked) { border-color: var(--biru); background: var(--biru-muda); color: var(--biru); font-weight: 600; }
.cp:has(input:focus-visible) { box-shadow: var(--cincin); }
.cp .uk { font-size: 11px; color: var(--teks-redup); font-weight: 400; }
.cp:has(input:checked) .uk { color: var(--biru); }

.zona { display: grid; justify-items: center; gap: 6px; padding: 24px 16px; text-align: center; border: 1.5px dashed var(--garis-kuat); border-radius: var(--r-kartu);
  background: color-mix(in srgb, var(--dasar) 50%, var(--kartu)); cursor: pointer; transition: border-color .15s, background .15s; }
.zona:hover, .zona.seret { border-color: var(--biru); background: var(--biru-lembut); }
.zona .ikon { width: 24px; height: 24px; color: var(--biru); }
.zona .jdl { font-weight: 600; }
.zona input { display: none; }
.daftar-berkas { display: grid; gap: 8px; }
.item-berkas { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border: 1px solid var(--garis); border-radius: var(--r-kontrol); background: var(--kartu); }
.item-berkas .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-berkas .ikon-berkas { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; background: var(--biru-muda); color: var(--biru); font-size: 10px; font-weight: 700; }
.item-berkas .sub { display: flex; gap: 8px; align-items: center; }
.tabel-massal { width: 100%; border-collapse: collapse; }
.tabel-massal th { text-align: left; font-size: 12px; color: var(--teks-redup); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--garis); }
.tabel-massal td { padding: 6px 8px; border-bottom: 1px solid var(--garis); vertical-align: middle; }
.tabel-massal td.no { width: 32px; color: var(--teks-redup); font-variant-numeric: tabular-nums; }
.tabel-massal td.nm { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabel-massal .kontrol { height: 32px; font-size: 13px; }
.tabel-massal tr.salah .kontrol { border-color: var(--merah); }

.info { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-kontrol); background: var(--biru-muda); color: var(--teks); font-size: 13px; }
.info .ikon { color: var(--biru); margin-top: 2px; }
.info button { border: 0; background: none; color: var(--biru); font-weight: 600; cursor: pointer; padding: 0; font-size: inherit; text-decoration: underline; }
.galat-ringkas { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-kontrol); background: var(--merah-lembut); color: var(--merah); font-size: 13px; font-weight: 500; }

.ringkasan-kartu { padding: 20px; display: grid; gap: 16px; }
.ringkasan-kartu h2 { font-size: 15px; }
.rk-baris { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.rk-baris .k { color: var(--teks-redup); }
.rk-baris .v { font-weight: 500; overflow-wrap: anywhere; }
.kemajuan { display: grid; gap: 6px; }
.kemajuan .meteran > span { transition: width .25s; }
.daftar-cek { display: grid; gap: 6px; font-size: 13px; }
.daftar-cek li { display: flex; gap: 8px; align-items: center; color: var(--teks-redup); list-style: none; }
.daftar-cek li.ok { color: var(--teks); }
.daftar-cek li .ikon { width: 14px; height: 14px; }
.daftar-cek li.ok .ikon { color: var(--hijau); }
.daftar-cek ul { margin: 0; padding: 0; display: grid; gap: 6px; }
.pratinjau { border-radius: var(--r-kontrol); overflow: hidden; border: 1px solid var(--garis); background: var(--dasar); }
.pratinjau iframe { width: 100%; height: 420px; border: 0; display: block; }
.pratinjau .judul-prt { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px; color: var(--teks-redup); border-bottom: 1px solid var(--garis); background: var(--kartu); }

/* Lapisan unggah */
.lapisan { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--dasar) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal { width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; display: grid; gap: 16px; background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r-kartu); box-shadow: var(--bayang-2); }
.modal .aksi { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.progres-item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.progres-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progres-item .st { font-size: 12px; color: var(--teks-redup); }
.progres-item.ok .st { color: var(--hijau); }
.progres-item.gagal .st { color: var(--merah); }
.progres-item .putar { width: 14px; height: 14px; border: 2px solid var(--biru); border-right-color: transparent; border-radius: 50%; animation: putar .7s linear infinite; }
.progres-item .ikon { width: 16px; height: 16px; }
.progres-item.ok .ikon { color: var(--hijau); }
.progres-item.gagal .ikon { color: var(--merah); }

/* Selesai */
.selesai { max-width: 640px; margin: 24px auto 0; width: 100%; display: grid; gap: 24px; justify-items: center; text-align: center; padding: 40px 32px; }
.lingkar-cek { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--hijau-lembut); color: var(--hijau); }
.lingkar-cek .ikon { width: 32px; height: 32px; stroke-width: 2.4; }
.tiket-besar { display: inline-flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: var(--r-pill); background: var(--biru-muda); color: var(--biru); font-weight: 700; font-size: 18px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.selesai .rk { width: 100%; text-align: left; display: grid; gap: 8px; padding: 16px; border-radius: var(--r-kontrol); border: 1px solid var(--garis); }
.selesai .aksi { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

@media (max-width: 1100px) {
  .form-tata { grid-template-columns: minmax(0, 1fr); }
  .form-kanan { position: static; }
}
@media (max-width: 560px) {
  .baris-2, .baris-3 { grid-template-columns: 1fr; }
  .bagian { padding: 16px; }
  .segmen { grid-template-columns: 1fr; }
  .selesai { padding: 32px 16px; }
}

/* ================================================================ LANGKAH 5–7 */
.tbl.bahaya-isi { background: var(--merah); border-color: var(--merah); color: var(--kartu); }
.tbl.bahaya-isi:hover { background: color-mix(in srgb, var(--merah) 85%, var(--teks)); color: var(--kartu); }
[data-tema="gelap"] .tbl.bahaya-isi, [data-tema="gelap"] .tbl.bahaya-isi:hover { color: var(--dasar); }
.detail-judul h1 { max-width: 900px; }
.meta-detail { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.meta-teks { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.meta-teks .sep::before { content: "·"; }
.detail-tata { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.detail-kiri { display: grid; gap: 16px; min-width: 0; }
.detail-kanan { position: sticky; top: 88px; display: grid; gap: 16px; }

.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stepper li { position: relative; display: flex; gap: 10px; align-items: flex-start; padding-right: 8px; }
.stepper li:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: 36px; right: 0; height: 2px; background: var(--garis); border-radius: 2px; }
.stepper li.lewat:not(:last-child)::after { background: var(--biru); }
.stepper .bulat { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700;
  background: var(--kartu); border: 2px solid var(--garis-kuat); color: var(--teks-redup); }
.stepper .bulat .ikon { width: 14px; height: 14px; stroke-width: 2.6; }
.stepper li.lewat .bulat { background: var(--biru); border-color: var(--biru); color: var(--teks-di-biru); }
.stepper li.kini .bulat { border-color: var(--biru); color: var(--biru); box-shadow: 0 0 0 4px var(--biru-muda); }
.stepper li.kini:last-child .bulat { background: var(--hijau); border-color: var(--hijau); color: var(--kartu); box-shadow: 0 0 0 4px var(--hijau-lembut); }
.stepper .tk { display: grid; gap: 2px; padding-top: 3px; position: relative; z-index: 1; background: var(--kartu); padding-right: 8px; }
.stepper .jdl { font-weight: 600; }
.stepper li:not(.lewat):not(.kini) .jdl { color: var(--teks-redup); }
.stepper .sub-tahap { display: inline-flex; align-self: start; margin-top: 2px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--biru-muda); color: var(--biru); font-size: 11px; font-weight: 600; }
.stepper.batal { opacity: .55; }

.kelompok-berkas { display: grid; gap: 8px; margin-bottom: 16px; }
.kelompok-berkas:last-of-type { margin-bottom: 0; }
.kelompok-berkas .kel, .kelompok-isian .kel { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--teks-redup); }
.sub-berkas { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 2px; }
.unggah-ringkas { display: flex; gap: 8px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--garis); }
.kepala-kartu .ket { font-weight: 400; }

.pemohon-baris { display: flex; gap: 12px; align-items: center; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--garis); }
.kelompok-isian { display: grid; gap: 8px; margin-bottom: 16px; }
.kelompok-isian:last-child { margin-bottom: 0; }
.dl { margin: 0; display: grid; gap: 8px; }
.dl-baris { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px; }
.dl-baris dt { color: var(--teks-redup); }
.dl-baris dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.linimasa { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.linimasa li.log { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.titik-log { width: 8px; height: 8px; border-radius: 50%; background: var(--garis-kuat); margin: 6px auto 0; }
.linimasa li.komen { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
.gelembung { padding: 10px 14px; border-radius: 4px var(--r-kartu) var(--r-kartu) var(--r-kartu); background: var(--abu-lembut); }
.komen.admin .gelembung { background: var(--biru-muda); }
.komen.revisi .gelembung { background: var(--merah-lembut); }
.kepala-komen { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
.kotak-komen { display: grid; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--garis); }
.kotak-komen textarea { min-height: 64px; }
.kotak-komen .tbl { justify-self: end; }

.sorot-waktu { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r-kontrol); background: var(--biru-muda); }
.sorot-waktu .ikon { color: var(--biru); width: 20px; height: 20px; margin-top: 2px; }
.sorot-waktu .besar { font-size: 17px; font-weight: 600; }
.sorot-waktu.ok { background: var(--hijau-lembut); }
.sorot-waktu.ok .ikon { color: var(--hijau); }
.kelola { gap: 0; }
.blok-kelola { display: grid; gap: 8px; padding: 16px 0; border-top: 1px solid var(--garis); }
.kelola .blok-kelola:first-of-type { border-top: 0; }
.kelola > .kepala-kartu { padding-bottom: 8px; }
.lbl-kelola { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--teks-redup); }
.baris-tombol { display: flex; gap: 8px; align-items: center; }
.baris-tombol .kontrol { flex: 1; }
.kelola .kontrol { height: 36px; font-size: 13px; }
.kelola textarea.kontrol { height: auto; min-height: 56px; }
.pratinjau-nomor { padding: 10px 12px; border-radius: var(--r-kontrol); background: var(--abu-lembut); }

.bank-tata { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
.ringkas-tanggal { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; }
.cari-besar { position: relative; }
.cari-besar .kontrol { height: 52px; font-size: 16px; padding-left: 48px; border-radius: var(--r-kartu); box-shadow: var(--bayang-1); }
.cari-besar > .ikon { left: 16px; top: 16px; }
.filter-arsip { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-arsip .kontrol { width: auto; height: 36px; font-size: 13px; }
.unit-kepala { position: sticky; top: 64px; z-index: 2; padding: 10px 20px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--biru); background: var(--biru-muda); border-top: 1px solid var(--garis); }
.unit-kepala:first-child { border-top: 0; border-radius: var(--r-kartu) var(--r-kartu) 0 0; }
.pejabat { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--garis); }
.pejabat > div:first-child { flex: 1; }
.pejabat .sub { display: flex; gap: 4px; flex: none; }
.galeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.templat { overflow: hidden; display: grid; }
.templat .thumb { position: relative; aspect-ratio: 1 / 1.2; background: var(--abu-lembut); display: grid; place-items: center; border-bottom: 1px solid var(--garis); overflow: hidden; }
.templat .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; z-index: 1; }
.templat .thumb .ikon { width: 40px; height: 40px; color: var(--teks-redup); stroke-width: 1.2; }
.templat .isi { padding: 14px; display: grid; gap: 4px; }
.aksi-templat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

@media (max-width: 1100px) {
  .detail-tata, .bank-tata { grid-template-columns: minmax(0, 1fr); }
  .detail-kanan { position: static; grid-row: 1; }
}
@media (max-width: 560px) {
  .stepper { grid-template-columns: 1fr 1fr; row-gap: 16px; }
  .stepper li::after { display: none; }
  .dl-baris { grid-template-columns: 1fr; gap: 0; }
  .pejabat { flex-wrap: wrap; padding: 10px 16px; }
  .unit-kepala { top: 108px; padding: 10px 16px; }
}

/* ================================================================ LOGO */
.merek img.logo-penuh { height: 76px; width: auto; max-width: 100%; display: block; }
.logo-gelap { display: none !important; }
[data-tema="gelap"] .logo-gelap { display: block !important; }
[data-tema="gelap"] .logo-terang { display: none !important; }
.merek-sisi { flex: 1; min-width: 0; display: flex; align-items: center; padding: 4px 0 4px 8px; }
.logo-sisi { width: 100%; max-width: 168px; height: auto; display: block; }
.lambang-sisi { display: none; width: 40px; height: 40px; border-radius: 50%; background: var(--kartu); place-items: center; }
[data-tema="gelap"] .lambang-sisi { background: var(--teks); }
.lambang-sisi img { width: 36px; height: 36px; display: block; }
.nama-app { display: grid; gap: 0; padding: 12px 8px 0; margin-top: -8px; border-top: 1px solid var(--sisi-garis); }
.nama-app .nm { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: var(--sisi-teks); }
.nama-app .ket { font-size: 12px; }
.kerangka.lipat .logo-sisi, .kerangka.lipat .nama-app { display: none; }
.kerangka.lipat .lambang-sisi { display: grid; }
.kerangka.lipat .merek-sisi { padding: 0; justify-content: center; }
.lambang-hp { width: 28px; height: 28px; display: block; }
@media (max-width: 560px) { .merek img.logo-penuh { height: 60px; } }

const simpan = {
  get(k, sesi) { try { return JSON.parse((sesi ? sessionStorage : localStorage).getItem(k)); } catch (e) { return null; } },

  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};

const isoBulan = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);
const keTanggal = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };

  pendek: s => { const d = keTanggal(s); return d ? d.getDate() + ' ' + BULAN[d.getMonth()] : '—'; },

/* ===================================================================== TOAST */
function toast(pesan, jenis) {
  const el = document.createElement('div');
  el.className = 'toast' + (jenis === 'salah' ? ' salah' : '');
  el.innerHTML = (jenis === 'salah' ? ik('awas') : jenis === 'ok' ? ik('cek') : '') + '<span>' + esc(pesan) + '</span>';
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 3200);
}

/* ===================================================================== API */
async function api(aksi, data) {
  const sesi = Sesi.ambil();
  const auth = sesi ? { nama: sesi.nama, token: sesi.token || '' } : {};
  if (DEMO) {
    await new Promise(r => setTimeout(r, 180)); // jeda kecil agar terasa seperti jaringan
    return Demo.panggil(aksi, data || {}, auth);
  }
  let res;
  try {
    // text/plain = "simple request": tidak memicu preflight CORS di Apps Script
    // credentials: 'omit' = tanpa cookie akun Google browser, jadi tidak terkena galat multi-akun Google
    res = await fetch(KONFIG.API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({ aksi, data: data || {}, auth }) });
  } catch (e) {
    throw galat('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.');
  }
  let json;
  try { json = await res.json(); } catch (e) { throw galat('Balasan server tidak dapat dibaca.'); }
  if (!json.ok) throw galat(json.error || 'Terjadi kendala.', json.kolom);
  return json.data;
}
function galat(pesan, kolom) { const e = new Error(pesan); e.kolom = kolom || null; return e; }

const Sesi = {
  KUNCI: 'copm_sesi',
  ambil() {
    const s = simpan.get(this.KUNCI) || simpan.get(this.KUNCI, true);
    if (!s) return null;
    if (s.kadaluarsa && new Date(s.kadaluarsa) < new Date()) { this.hapus(); return null; }
    return s;
  },
  pasang(data, ingat) {
    const s = { nama: data.nama, peran: data.peran, ekosistem: data.ekosistem, jabatan: data.jabatan || '', token: data.token || '' };
    if (ingat) {
      s.kadaluarsa = data.kadaluarsa || new Date(Date.now() + 90 * 86400000).toISOString();
      simpan.set(this.KUNCI, s);
    } else {
      simpan.set(this.KUNCI, s, true);
    }
    simpan.set('copm_nama_terakhir', data.nama);
  },
  hapus() { simpan.del(this.KUNCI); }
};
const Tema = {
  kini: () => document.documentElement.getAttribute('data-tema') || 'terang',
  ganti() {
    const t = this.kini() === 'gelap' ? 'terang' : 'gelap';
    document.documentElement.setAttribute('data-tema', t);
    try { localStorage.setItem('copm_tema', t); } catch (e) {}
    $$('[data-tombol-tema]').forEach(b => { b.innerHTML = ikonTema(); b.title = labelTema(); b.setAttribute('aria-label', labelTema()); });
  }
};
const ikonTema = () => Tema.kini() === 'gelap' ? ik('matahari') : ik('bulan');
const labelTema = () => Tema.kini() === 'gelap' ? 'Gunakan tampilan terang' : 'Gunakan tampilan gelap';
const tombolTema = () => '<button class="tbl hantu ikon-saja" data-tombol-tema onclick="Tema.ganti()" title="' + labelTema() + '" aria-label="' + labelTema() + '">' + ikonTema() + '</button>';

};

const RUTE = [
  { pola: /^#?masuk$/, fn: halamanMasuk, publik: true },
  { pola: /^#beranda$/, fn: halamanBeranda, judul: 'Beranda', nav: 'beranda' },
  { pola: /^#ajukan$/, fn: () => halamanAjukan(false), judul: 'Ajukan baru', nav: 'ajukan' },
  { pola: /^#ajukan\/(surat|desain)\/(\w+)$/, fn: m => halamanForm(m[1], m[2], false), judul: 'Ajukan baru', nav: 'ajukan' },
  { pola: /^#catat$/, fn: () => halamanAjukan(true), judul: 'Catat pengajuan', nav: 'catat', admin: true },
  { pola: /^#catat\/(surat|desain)\/(\w+)$/, fn: m => halamanForm(m[1], m[2], true), judul: 'Catat pengajuan', nav: 'catat', admin: true },
  { pola: /^#selesai\/([\w-]+)$/, fn: halamanSelesai, judul: 'Pengajuan terkirim', nav: 'ajukan' },
  { pola: /^#tiket\/([\w-]+)$/, fn: halamanDetail, judul: 'Detail pengajuan', nav: 'beranda' },
  { pola: /^#sunting\/([\w-]+)$/, fn: halamanSunting, judul: 'Sunting pengajuan', nav: 'beranda' },
  { pola: /^#arsip$/, fn: halamanArsip, judul: 'Arsip', nav: 'arsip' },
  { pola: /^#direktori$/, fn: halamanDirektori, judul: 'Direktori pejabat', nav: 'direktori' },
  { pola: /^#format$/, fn: halamanFormat, judul: 'Format surat', nav: 'format' },
  { pola: /^#admin\/bank$/, fn: halamanBank, judul: 'Bank nomor', nav: 'bank', admin: true }
];

async function jalankanRute() {
  tutupMenu();
  const hash = location.hash || '#beranda';
  const sesi = Sesi.ambil();
  const rute = RUTE.find(r => r.pola.test(hash));
  if (!rute) { location.hash = sesi ? '#beranda' : '#masuk'; return; }
  if (!rute.publik && !sesi) { location.hash = '#masuk'; return; }
  if (rute.publik && sesi) { location.hash = '#beranda'; return; }
  if (rute.admin && sesi.peran !== 'admin') { location.hash = '#beranda'; return; }
  if (!S.ref) {
    try {
      S.ref = await api('init');
    } catch (e) {
      $('#aplikasi').innerHTML = '<div class="segera" style="min-height:100vh;align-content:center">' + ik('awas') + '<h2>COPM belum dapat dibuka</h2><p>' + esc(e.message) + '</p><button class="tbl utama" onclick="location.reload()">' + ik('segar') + 'Muat ulang</button></div>';
      return;
    }
    // Token admin tidak berlaku lagi → minta masuk ulang
    if (sesi && sesi.peran === 'admin' && (!S.ref.sesi || S.ref.sesi.peran !== 'admin')) {
      Sesi.hapus(); S.ref = null; toast('Sesi admin sudah berakhir. Silakan masuk ulang.'); location.hash = '#masuk'; return;
    }
  }
  const m = hash.match(rute.pola);
  if (rute.publik) { rute.fn(m); return; }
  pasangKerangka(rute);
  document.title = (rute.judul ? rute.judul + ' · ' : '') + 'COPM DPI';
  rute.fn(m);
}
window.addEventListener('hashchange', jalankanRute);

function halamanMasuk() {
  document.title = 'Masuk · COPM DPI';
  const p = S.ref.pengaturan || {};
  const foto = String(p.foto_sampul_urls || '').split(',').map(s => s.trim()).filter(Boolean);
  const durasi = Math.max(1, foto.length) * 5;
  // Crossfade: tiap foto tampil 5 detik, pudar 1 detik
  const tampil = 100 / Math.max(1, foto.length), pudar = 100 / (durasi);
  const kf = '<style>@keyframes pudar{0%{opacity:0}' + pudar.toFixed(2) + '%{opacity:1}' + tampil.toFixed(2) + '%{opacity:1}' + Math.min(100, tampil + pudar).toFixed(2) + '%{opacity:0}100%{opacity:0}}</style>';
  const slide = kf + (foto.length
    ? foto.map((u, i) => '<div class="slide' + (foto.length === 1 ? ' tunggal' : '') + '" style="background-image:url(\'' + esc(u) + '\');animation-delay:' + (i * 5) + 's"></div>').join('')
    : '<div class="slide gradasi tunggal"></div>');
  const logo = p.logo_url
    ? '<img class="logo-penuh" src="' + esc(p.logo_url) + '" alt="' + ALT_LOGO + '">'
    : '<img class="logo-penuh logo-terang" src="' + ASET.warna + '" alt="' + ALT_LOGO + '"><img class="logo-penuh logo-gelap" src="' + ASET.putih + '" alt="' + ALT_LOGO + '">';

  $('#aplikasi').innerHTML =
    (DEMO ? pitaDemo() : '') +
    '<main class="masuk">' +
      '<section class="sampul" style="--durasi:' + durasi + 's" aria-hidden="true">' + slide +
        '<div class="sampul-pola"></div>' +
        '<div class="sampul-teks"><div class="besar">Satu antrean untuk semua pengajuan surat dan desain DPI.</div>' +
        '<div class="kecil">Ajukan, pantau prosesnya, dan unduh hasilnya di satu tempat. Semuanya tercatat rapi dan bisa dilihat kapan saja.</div></div>' +
      '</section>' +
      '<section class="panel-masuk">' +
        '<div class="atas">' + tombolTema() + '</div>' +
        '<form class="form-masuk" id="formMasuk" novalidate autocomplete="off">' +
          '<div class="merek">' + logo + '</div>' +
          '<div><p class="salam">' + esc(p.salam || 'Selamat datang di') + '</p>' +
            '<h1>COPM <span>DPI</span></h1>' +
            '<p class="sub-masuk">Sistem pengajuan surat dan desain Direktorat Pendidikan Internasional, IPB University.</p></div>' +
          '<div style="display:grid;gap:16px">' +
            '<div class="isian" id="isianNama"><label for="inputNama">Nama</label>' +
              '<div class="kombo" id="kombo">' +
                '<div class="dengan-ikon">' + ik('cari') +
                  '<input class="kontrol" id="inputNama" role="combobox" aria-expanded="false" aria-controls="daftarNama" aria-autocomplete="list" placeholder="Ketik atau pilih nama Anda">' +
                '</div>' +
                '<div class="kombo-daftar" id="daftarNama" role="listbox"></div>' +
              '</div>' +
              '<span class="pesan-salah" id="salahNama"></span>' +
            '</div>' +
            '<div class="isian" id="isianPasskey" hidden><label for="inputPasskey">Pass Key admin</label>' +
              '<div class="dengan-ikon">' + ik('pagar') +
                '<input class="kontrol" id="inputPasskey" type="password" autocomplete="current-password" placeholder="Masukkan Pass Key">' +
                '<button type="button" class="tbl hantu kecil ikon-saja tbl-mata" id="tblMata" aria-label="Tampilkan Pass Key">' + ik('mata') + '</button>' +
              '</div>' +
              '<span class="pesan-salah" id="salahPasskey"></span>' +
            '</div>' +
            '<label class="centang"><input type="checkbox" id="inputIngat" checked><span>Ingat saya di perangkat ini selama 90 hari</span></label>' +
          '</div>' +
          '<button class="tbl utama penuh" type="submit" id="tblMasuk">Masuk</button>' +
          (DEMO ? '<div class="petunjuk-demo">Mode demo · Pass Key admin: <b>demo</b></div>' : '') +
          '<p class="kaki-masuk">Nama Anda belum ada di daftar? Hubungi admin COPM di Sekretariat DPI.</p>' +
        '</form>' +
      '</section>' +
    '</main>';

  const daftar = S.ref.pengguna.filter(u => u.aktif);
  let terpilih = null, sorot = -1, saring = [];
  const input = $('#inputNama'), kombo = $('#kombo'), wadah = $('#daftarNama');

  function tampilkan(q) {
    const k = (q || '').toLowerCase().trim();
    saring = daftar.filter(u => !k || (u.nama + ' ' + u.ekosistem + ' ' + (u.jabatan || '')).toLowerCase().includes(k));
    sorot = saring.length ? 0 : -1;
    wadah.innerHTML = saring.length
      ? saring.map((u, i) => '<div class="opsi" role="option" id="opsi' + i + '" data-i="' + i + '" aria-selected="' + (i === sorot) + '">' +
          '<span class="avatar' + (u.peran === 'admin' ? ' admin' : '') + '">' + inisial(u.nama) + '</span>' +
          '<span><span class="nm">' + esc(u.nama) + '</span><br><span class="ket">' + esc(u.ekosistem) + (u.jabatan ? ' · ' + esc(u.jabatan) : '') + (u.peran === 'admin' ? ' · Admin' : '') + '</span></span></div>').join('')
      : '<div class="opsi-kosong">Nama tidak ditemukan</div>';
    kombo.classList.add('buka'); input.setAttribute('aria-expanded', 'true');
  }
  function tutup() { kombo.classList.remove('buka'); input.setAttribute('aria-expanded', 'false'); }
  function pilih(u) {
    terpilih = u; input.value = u.nama; tutup();
    $('#isianNama').classList.remove('salah');
    const pk = $('#isianPasskey');
    if (u.peran === 'admin') { pk.hidden = false; pk.classList.add('muncul'); setTimeout(() => $('#inputPasskey').focus(), 30); }
    else { pk.hidden = true; $('#tblMasuk').focus(); }
  }
  function geserSorot(arah) {
    if (!saring.length) return;
    sorot = (sorot + arah + saring.length) % saring.length;
    $$('.opsi', wadah).forEach((o, i) => o.setAttribute('aria-selected', i === sorot));
    const el = $('#opsi' + sorot); if (el) el.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('focus', () => tampilkan(terpilih && input.value === terpilih.nama ? '' : input.value));
  input.addEventListener('input', () => { terpilih = null; $('#isianPasskey').hidden = true; tampilkan(input.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); kombo.classList.contains('buka') ? geserSorot(1) : tampilkan(input.value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); geserSorot(-1); }
    else if (e.key === 'Enter' && kombo.classList.contains('buka') && sorot > -1) { e.preventDefault(); pilih(saring[sorot]); }
    else if (e.key === 'Escape') tutup();
  });
  wadah.addEventListener('mousedown', e => { const o = e.target.closest('.opsi'); if (o) { e.preventDefault(); pilih(saring[Number(o.dataset.i)]); } });
  input.addEventListener('blur', () => setTimeout(() => {
    tutup();
    if (!terpilih && input.value) { const u = daftar.find(x => x.nama.toLowerCase() === input.value.trim().toLowerCase()); if (u) pilih(u); }
  }, 120));
  $('#tblMata').addEventListener('click', () => {
    const f = $('#inputPasskey'); const lihat = f.type === 'password';
    f.type = lihat ? 'text' : 'password';
    $('#tblMata').innerHTML = ik(lihat ? 'mataTutup' : 'mata');
    $('#tblMata').setAttribute('aria-label', lihat ? 'Sembunyikan Pass Key' : 'Tampilkan Pass Key');
  });

  // Isi otomatis nama terakhir di perangkat ini
  const terakhir = simpan.get('copm_nama_terakhir');
  const u0 = terakhir && daftar.find(u => u.nama === terakhir);
  if (u0) { terpilih = u0; input.value = u0.nama; if (u0.peran === 'admin') $('#isianPasskey').hidden = false; }

  $('#formMasuk').addEventListener('submit', async e => {
    e.preventDefault();
    $('#isianNama').classList.remove('salah'); $('#isianPasskey').classList.remove('salah');
    if (!terpilih) { $('#salahNama').textContent = 'Pilih nama Anda dari daftar.'; $('#isianNama').classList.add('salah'); input.focus(); return; }
    const passkey = $('#inputPasskey').value;
    if (terpilih.peran === 'admin' && !passkey) { $('#salahPasskey').textContent = 'Pass Key wajib diisi untuk admin.'; $('#isianPasskey').classList.add('salah'); $('#inputPasskey').focus(); return; }
    const tbl = $('#tblMasuk'); tbl.disabled = true; tbl.innerHTML = '<span class="putar"></span>Memeriksa…';
    try {
      const hasil = await api('masuk', { nama: terpilih.nama, passkey: terpilih.peran === 'admin' ? passkey : '' });
      Sesi.pasang(hasil, $('#inputIngat').checked);
      S.ref = null; S.beranda = { tab: null, filter: {}, urut: 'masuk', q: '', halaman: 1 };
      location.hash = '#beranda';
    } catch (err) {
      tbl.disabled = false; tbl.textContent = 'Masuk';
      if (err.kolom && err.kolom.passkey) { $('#salahPasskey').textContent = err.kolom.passkey; $('#isianPasskey').classList.add('salah'); $('#inputPasskey').select(); }
      else toast(err.message, 'salah');
    }
  });
}

function gambarBilah() {
  const B = S.beranda, f = B.filter;
  const chip = Object.keys(OPSI_FILTER).map(k => {
    const d = OPSI_FILTER[k];
    if (f[k]) return '<button class="chip aktif" onclick="bukaFilter(event,\'' + k + '\')">' + d.label + ': ' + esc(d.tampil ? d.tampil(f[k]) : f[k]) +
      '<span class="x" role="button" aria-label="Hapus filter ' + d.label + '" onclick="event.stopPropagation();setFilter(\'' + k + '\',\'\')">' + ik('x') + '</span></button>';
    return '<button class="chip" onclick="bukaFilter(event,\'' + k + '\')">' + ik('tambah') + d.label + '</button>';
  }).join('');
  const kartuAktif = f.kartu ? KARTU.find(x => x.filter.kartu === f.kartu) : null;
  const chipKartu = kartuAktif ? '<button class="chip aktif" onclick="setFilter(\'kartu\',\'\')">' + kartuAktif.label + '<span class="x">' + ik('x') + '</span></button>' : '';
  const adaFilter = Object.keys(f).some(k => f[k]);
  $('#bilah').innerHTML =
    '<div class="cari dengan-ikon">' + ik('cari') + '<input class="kontrol" id="cariBeranda" type="search" placeholder="Cari perihal, tiket, nomor, pemohon" value="' + esc(B.q) + '"></div>' +
    chipKartu + chip +
    (adaFilter ? '<button class="tautan-hapus" onclick="hapusFilter()">Hapus semua filter</button>' : '') +
    '<div class="kanan"><label class="sr" for="urutBeranda">Urutkan</label>' +
      '<select class="kontrol" id="urutBeranda" onchange="S.beranda.urut=this.value;muatDaftar()">' +
      OPSI_URUT.map(o => '<option value="' + o[0] + '"' + (B.urut === o[0] ? ' selected' : '') + '>Urut: ' + o[1] + '</option>').join('') +
    '</select></div>';
  let jeda;
  $('#cariBeranda').addEventListener('input', e => { clearTimeout(jeda); jeda = setTimeout(() => { B.q = e.target.value; B.halaman = 1; muatDaftar(); }, 250); });
}

function bukaFilter(ev, k) {
  ev.stopPropagation();
  const d = OPSI_FILTER[k], nilai = S.beranda.filter[k];
  bukaMenu(ev.currentTarget, d.opsi().map(o => ({
    label: d.tampil ? d.tampil(o) : o, terpilih: nilai === o, aksi: () => setFilter(k, nilai === o ? '' : o)
  })));
}
function setFilter(k, v) {
  const f = S.beranda.filter;
  if (k === 'status' || k === 'kartu') { delete f.kartu; delete f.status; }
  if (v) f[k] = v; else delete f[k];
  S.beranda.halaman = 1;
  gambarBilah(); muatDaftar();
}
function hapusFilter() { S.beranda.filter = {}; S.beranda.q = ''; S.beranda.halaman = 1; gambarBilah(); muatDaftar(); }
function klikKartu(id) {
  const k = KARTU.find(x => x.id === id);
  const f = S.beranda.filter;
  const aktif = k.filter.status ? f.status === k.filter.status && !f.kartu : f.kartu === k.filter.kartu;
  delete f.status; delete f.kartu;
  if (!aktif) Object.assign(f, k.filter);
  S.beranda.halaman = 1;
  gambarBilah(); muatDaftar();
}

let nomorMuat = 0;
async function muatDaftar() {
  const B = S.beranda;
  const ke = ++nomorMuat;
  if (!S.daftar || S.daftar._tab !== B.tab) $('#wadahTabel').innerHTML = rangkaTabel();
  else $('#wadahTabel').style.opacity = '.6';
  try {
    const filter = Object.assign({}, B.filter, { q: B.q, milik: B.tab === 'saya' });
    const hasil = await api('daftarPengajuan', { filter, urut: B.urut, halaman: B.halaman });
    if (ke !== nomorMuat || !$('#wadahTabel')) return; // ada permintaan lebih baru / halaman sudah berganti
    hasil._tab = B.tab;
    if (B.halaman > 1 && S.daftar && S.daftar._tab === B.tab) hasil.baris = S.daftar.baris.concat(hasil.baris);
    if (B.tab === 'semua') hasil.ringkasanGlobal = hasil.ringkasan;
    else if (S.daftar && S.daftar.ringkasanGlobal) hasil.ringkasanGlobal = S.daftar.ringkasanGlobal;
    S.daftar = hasil;
    gambarKartu(); gambarTabel();
    if (hasil.nomorHariIni && $('#alatAdmin')) gambarAlatAdmin(hasil.nomorHariIni);
    const jml = $('#jml-' + B.tab); if (jml) jml.textContent = hasil.ringkasan.total;
    const badge = $('#badgeBaru');
    if (badge && hasil.ringkasanGlobal) { badge.className = hasil.ringkasanGlobal.Baru ? 'hitung' : ''; badge.textContent = hasil.ringkasanGlobal.Baru || ''; }
  } catch (e) {
    if (ke !== nomorMuat || !$('#wadahTabel')) return;
    $('#wadahTabel').innerHTML = '<div class="kosong">' + ik('awas') + '<div class="judul">Daftar belum dapat dimuat</div><div>' + esc(e.message) + '</div><button class="tbl kecil" onclick="muatDaftar()">' + ik('segar') + 'Coba lagi</button></div>';
  } finally {
    const w = $('#wadahTabel'); if (w) w.style.opacity = '';
  }
}

function gambarKartu() {
  if (!$('#kartuAngka')) return;
  const r = S.daftar.ringkasan, f = S.beranda.filter;
  $('#kartuAngka').innerHTML = KARTU.map(k => {
    const aktif = k.filter.status ? (f.status === k.filter.status && !f.kartu) : f.kartu === k.filter.kartu;
    const sorot = (k.id === 'Baru' || k.id === 'Mendesak') && r[k.id] > 0 && Sesi.ambil().peran === 'admin';
    return '<button class="angka' + (aktif ? ' aktif' : '') + (sorot ? ' sorot' : '') + '" onclick="klikKartu(\'' + k.id + '\')" aria-pressed="' + aktif + '">' +
      '<span class="lbl"><span class="titik" style="background:' + k.titik + (k.garis ? ';box-shadow:inset 0 0 0 1.5px var(--biru)' : '') + '"></span>' + k.label + '</span>' +
      '<span class="nilai">' + (r[k.id] || 0) + '</span></button>';
  }).join('');
}

function rangkaTabel() {
  let b = '';
  for (let i = 0; i < 6; i++) b += '<tr><td><div class="rangka" style="width:' + (60 + (i * 13) % 35) + '%"></div><div class="rangka" style="width:40%;margin-top:8px;height:10px"></div></td>' +
    '<td><div class="rangka" style="width:60px"></div></td><td><div class="rangka" style="width:110px"></div></td><td><div class="rangka" style="width:100px"></div></td><td><div class="rangka" style="width:70px"></div></td><td><div class="rangka" style="width:80px"></div></td><td></td></tr>';
  return '<div class="gulir"><table class="data">' + kepalaTabel() + '<tbody>' + b + '</tbody></table></div>';
}
function kepalaTabel() {
  return '<thead><tr><th>Pengajuan</th><th>Jenis</th><th>Pemohon</th><th>Waktu</th><th>Prioritas</th><th>Status</th><th><span class="sr">Aksi</span></th></tr></thead>';

      '<div>' + (adaFilter ? 'Coba ubah kata kunci atau hapus sebagian filter.' : 'Pengajuan surat dan desain akan tampil di sini.') + '</div>' +

function selWaktu(b) {
  const masuk = 'masuk ' + fmt.pendek(b.dibuat_pada);
  if (b.status === 'Selesai') return '<div class="sel-dua"><span class="a">Selesai ' + fmt.pendek(b.selesai_pada) + '</span><span class="k">' + masuk + '</span></div>';
  if (b.status === 'Dibatalkan') return '<div class="sel-dua w-biasa"><span class="a">Dibatalkan</span><span class="k">' + masuk + '</span></div>';
  if (b.prioritas === 'Biasa') return '<div class="sel-dua w-biasa"><span class="a">' + fmt.bulan(b.bulan_keperluan) + '</span><span class="k">' + masuk + '</span></div>';
  const n = selisihHari(b.batas_keperluan);
  const sisa = n < 0 ? 'lewat ' + (-n) + ' hari' : n === 0 ? 'hari ini' : 'sisa ' + n + ' hari';
  const kls = n < 0 ? 'w-lewat' : n <= 2 ? 'w-dekat' : '';
  return '<div class="sel-dua ' + kls + '"><span class="a">' + fmt.hari(b.batas_keperluan) + '</span><span class="k">' + sisa + ' · ' + masuk + '</span></div>';

/* ===================================================================== MENU POPOVER */
let menuAktif = null;
function bukaMenu(jangkar, item) {
  const sama = menuAktif && menuAktif.jangkar === jangkar;
  tutupMenu();
  if (sama) return;
  const el = document.createElement('div');
  el.className = 'menu'; el.setAttribute('role', 'menu');
  item.forEach(it => {
    if (it === '-') { el.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem');
    b.className = (it.bahaya ? 'bahaya ' : '') + (it.terpilih ? 'terpilih' : '');
    b.innerHTML = (it.ikon ? ik(it.ikon) : '') + '<span>' + esc(it.label) + '</span>' + (it.terpilih ? ik('cek', 'cek') : '');
    if (it.mati) b.disabled = true;
    b.addEventListener('click', e => { e.stopPropagation(); tutupMenu(); it.aksi && it.aksi(); });
    el.appendChild(b);
  });
  document.body.appendChild(el);
  const r = jangkar.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = r.right - w; if (left < 8) left = Math.min(r.left, window.innerWidth - w - 8);
  let top = r.bottom + 4; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.left = Math.max(8, left) + 'px'; el.style.top = top + 'px';
  menuAktif = { el, jangkar };
  const pertama = el.querySelector('button:not([disabled])'); if (pertama) pertama.focus({ preventScroll: true });
}
function tutupMenu() { if (menuAktif) { menuAktif.el.remove(); menuAktif = null; } }
document.addEventListener('click', e => { if (menuAktif && !menuAktif.el.contains(e.target)) tutupMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupMenu(); });
window.addEventListener('resize', tutupMenu);
window.addEventListener('scroll', tutupMenu, true);
